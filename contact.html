<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | UniMatcher Hub</title>
    <link rel="icon" type="image/png" href="/src/assets/unimatcher-logo.png">
    <meta name="theme-color" content="#003B73">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap');
        
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .glass { background: rgba(255, 255, 255, 0.7); backdrop-filter: blur(20px); }
        .bg-mesh {
            background-color: #f8fafc;
            background-image: radial-gradient(at 0% 0%, rgba(249, 115, 22, 0.05) 0px, transparent 50%),
                              radial-gradient(at 100% 100%, rgba(0, 51, 102, 0.05) 0px, transparent 50%);
        }
        .btn-primary { background: #003366; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .btn-primary:hover { background: #002244; transform: translateY(-2px); box-shadow: 0 10px 20px -5px rgba(0, 51, 102, 0.3); }
    </style>
</head>
<body class="bg-mesh min-h-screen text-slate-900">

    <div class="max-w-6xl mx-auto px-6 py-16">
        <div class="flex flex-col md:flex-row gap-16 items-start">
            
            <div class="md:w-1/3 space-y-8">
                <div>
                    <h1 class="text-5xl font-extrabold tracking-tight text-slate-900 mb-6">Let's <span class="text-orange-500 text-6xl">talk.</span></h1>
                    <p class="text-slate-500 leading-relaxed font-medium">Have a question about a program or need help with your application? Choose how you'd like to reach us.</p>
                </div>

                <div class="space-y-4">
                    <a href="https://wa.me/+233547933440?text=Hello! I need help with UniMatcher." 
                       target="_blank" 
                       class="flex items-center gap-5 p-5 glass rounded-[2rem] border border-white hover:border-emerald-200 transition-all group shadow-sm hover:shadow-xl hover:shadow-emerald-500/10">
                        <div class="w-14 h-14 bg-emerald-500 text-white rounded-2xl flex items-center justify-center text-2xl group-hover:scale-110 transition-transform shadow-lg shadow-emerald-200">
                            <i class="fab fa-whatsapp"></i>
                        </div>
                        <div>
                            <p class="text-[10px] font-extrabold uppercase tracking-widest text-emerald-600 mb-1">Instant Chat</p>
                            <p class="font-bold text-slate-900">WhatsApp Support</p>
                        </div>
                    </a>

                    <a href="tel:YOUR_PHONE_NUMBER" 
                       class="flex items-center gap-5 p-5 glass rounded-[2rem] border border-white hover:border-blue-200 transition-all group shadow-sm hover:shadow-xl hover:shadow-blue-500/10">
                        <div class="w-14 h-14 bg-blue-600 text-white rounded-2xl flex items-center justify-center text-2xl group-hover:scale-110 transition-transform shadow-lg shadow-blue-200">
                            <i class="fas fa-phone"></i>
                        </div>
                        <div>
                            <p class="text-[10px] font-extrabold uppercase tracking-widest text-blue-600 mb-1">Voice Call</p>
                            <p class="font-bold text-slate-900">Call our Office</p>
                        </div>
                    </a>
                </div>

                <div class="p-8 bg-[#003366] rounded-[2.5rem] text-white overflow-hidden relative shadow-2xl">
                    <div class="relative z-10">
                        <h4 class="font-bold mb-2">Office Hours</h4>
                        <p class="text-blue-100 text-sm opacity-80">Monday — Friday</p>
                        <p class="text-lg font-bold">9:00 AM — 6:00 PM</p>
                    </div>
                    <i class="fas fa-clock absolute -bottom-4 -right-4 text-8xl text-white/5"></i>
                </div>
            </div>

            <div class="md:w-2/3 w-full">
                <div class="glass p-10 rounded-[3.5rem] border border-white shadow-2xl shadow-slate-200/50">
                    <form id="contactForm" class="space-y-8">
                        <div class="grid md:grid-cols-2 gap-8">
                            <div class="relative">
                                <label class="text-[10px] font-extrabold uppercase tracking-[0.2em] text-slate-400 mb-3 block px-2">Full Name</label>
                                <input type="text" id="name" required placeholder="Enter name" class="w-full bg-slate-50/50 border-b-2 border-slate-100 focus:border-orange-500 px-2 py-3 outline-none transition-all font-semibold">
                            </div>
                            <div class="relative">
                                <label class="text-[10px] font-extrabold uppercase tracking-[0.2em] text-slate-400 mb-3 block px-2">Email Address</label>
                                <input type="email" id="email" required placeholder="name@email.com" class="w-full bg-slate-50/50 border-b-2 border-slate-100 focus:border-orange-500 px-2 py-3 outline-none transition-all font-semibold">
                            </div>
                        </div>

                        <div class="relative">
                            <label class="text-[10px] font-extrabold uppercase tracking-[0.2em] text-slate-400 mb-3 block px-2">Subject</label>
                            <input type="text" id="subject" required placeholder="How can we help?" class="w-full bg-slate-50/50 border-b-2 border-slate-100 focus:border-orange-500 px-2 py-3 outline-none transition-all font-semibold">
                        </div>

                        <div class="relative">
                            <label class="text-[10px] font-extrabold uppercase tracking-[0.2em] text-slate-400 mb-3 block px-2">Your Message</label>
                            <textarea id="message" rows="4" required placeholder="Type your message here..." class="w-full bg-slate-50/50 border-b-2 border-slate-100 focus:border-orange-500 px-2 py-3 outline-none transition-all font-semibold resize-none"></textarea>
                        </div>

                        <button type="submit" id="submitBtn" class="btn-primary w-full text-white font-extrabold py-5 rounded-3xl shadow-xl flex items-center justify-center gap-3">
                            <span>SEND MESSAGE</span>
                            <i class="fas fa-paper-plane text-xs"></i>
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>
<script src="js/global.js"></script>
    <script>
    // This is your REAL verified worker URL
    const API_BASE = "https://api.unimatcher-skynetconsult.com/api/admin";
    
    document.getElementById('contactForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const btn = document.getElementById('submitBtn');
        const originalContent = btn.innerHTML;
        
        // Show Loading State
        btn.innerHTML = '<i class="fas fa-circle-notch fa-spin"></i> <span>SENDING...</span>';
        btn.disabled = true;

        const payload = {
            table: "contacts",
            data: [{
                name: document.getElementById('name').value,
                email: document.getElementById('email').value,
                subject: document.getElementById('subject').value,
                message: document.getElementById('message').value,
                status: 'unread'
            }]
        };

        try {
            const res = await fetch(`${API_BASE}/bulk-import`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            if (!res.ok) throw new Error("Server Error");

            // Success State
            btn.classList.remove('btn-primary');
            btn.classList.add('bg-emerald-500');
            btn.innerHTML = '<i class="fas fa-check-circle"></i> <span>SENT SUCCESSFULLY!</span>';
            e.target.reset();
            
            setTimeout(() => {
                btn.classList.remove('bg-emerald-500');
                btn.classList.add('btn-primary');
                btn.innerHTML = originalContent;
                btn.disabled = false;
            }, 3000);

        } catch (err) {
            console.error("Submission failed:", err);
            // Error State
            btn.classList.remove('btn-primary');
            btn.classList.add('bg-red-500');
            btn.innerHTML = '<i class="fas fa-times-circle"></i> <span>FAILED TO SEND</span>';
            
            setTimeout(() => {
                btn.classList.remove('bg-red-500');
                btn.classList.add('btn-primary');
                btn.innerHTML = originalContent;
                btn.disabled = false;
            }, 3000);
        }
    });
</script>
</body>
</html>
