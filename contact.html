<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | SkyNet Consult</title>
    <link rel="icon" type="image/png" href="images/Skynet.png">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        /* =========================================
           BASE STYLES & VARIABLES
           ========================================= */
        :root {
            --navy: #0a192f;
            --skynet-blue: #3b82f6;
            --skynet-gradient: linear-gradient(135deg, #3b82f6, #06b6d4, #3b82f6);
            --white: #ffffff;
            --gray-100: #f8fafc;
            --glass-bg: rgba(255, 255, 255, 0.85);
            --glass-border: rgba(255, 255, 255, 0.5);
            --border: rgba(226, 232, 240, 0.8);
            --transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: var(--gray-100); 
            color: var(--navy); 
            overflow-x: hidden; 
        }

        /* --- ATMOSPHERIC BACKGROUND GLOWS --- */
        .bg-glow {
            position: absolute; width: 600px; height: 600px;
            background: radial-gradient(circle, rgba(59,130,246,0.12) 0%, rgba(255,255,255,0) 70%);
            border-radius: 50%; z-index: -1; pointer-events: none;
            animation: floatGlow 10s infinite alternate ease-in-out;
        }
        .bg-glow.top-left { top: -100px; left: -100px; }
        .bg-glow.bottom-right { bottom: 20%; right: -200px; animation-delay: -5s; }

        @keyframes floatGlow {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(50px, 50px) scale(1.1); }
        }

        /* --- HERO SECTION --- */
        .contact-hero {
            padding: 10rem 8% 6rem;
            display: grid;
            grid-template-columns: 1fr 1.2fr;
            gap: 80px;
            align-items: flex-start;
            max-width: 1400px;
            margin: 0 auto;
            position: relative;
        }

        /* --- LEFT SIDE: TEXT & CONTACT CARDS --- */
        .hero-left {
            animation: slideUpFade 1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .hero-left h1 {
            font-size: clamp(2.5rem, 5vw, 4.5rem);
            font-weight: 800;
            line-height: 1.1;
            margin-bottom: 1.5rem;
            letter-spacing: -1.5px;
            color: var(--navy);
        }

        .highlight {
            background: var(--skynet-gradient);
            background-size: 200% auto;
            color: transparent;
            -webkit-background-clip: text;
            background-clip: text;
            animation: gradientText 4s linear infinite;
        }

        @keyframes gradientText {
            0% { background-position: 0% center; }
            100% { background-position: 200% center; }
        }

        .hero-description {
            font-size: 1.15rem;
            color: #64748b;
            line-height: 1.7;
            margin-bottom: 2.5rem;
        }

        /* Interactive Contact Method Cards */
        .contact-method {
            display: flex;
            align-items: center;
            gap: 20px;
            padding: 25px;
            background: var(--white);
            border-radius: 24px;
            border: 1px solid var(--border);
            margin-bottom: 20px;
            transition: var(--transition);
            text-decoration: none;
            color: inherit;
            box-shadow: 0 10px 30px rgba(0,0,0,0.02);
            transform-style: preserve-3d;
            position: relative;
            overflow: hidden;
        }

        .contact-method::before {
            content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(400px circle at var(--mouse-x, 50%) var(--mouse-y, 50%), rgba(59, 130, 246, 0.08), transparent 40%);
            z-index: 0; pointer-events: none; opacity: 0; transition: opacity 0.4s;
        }

        .contact-method:hover {
            border-color: rgba(59, 130, 246, 0.3);
            box-shadow: 0 20px 40px rgba(59, 130, 246, 0.08);
        }
        
        .contact-method:hover::before { opacity: 1; }
        .contact-method > * { position: relative; z-index: 1; pointer-events: none; transform: translateZ(20px); }

        .icon-box {
            width: 60px;
            height: 60px;
            background: #eff6ff;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            color: var(--skynet-blue);
            box-shadow: 0 5px 15px rgba(59, 130, 246, 0.1);
        }

        /* --- RIGHT SIDE: GLASS FORM --- */
        .contact-form-card {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 3.5rem;
            border-radius: 32px;
            border: 1px solid var(--glass-border);
            box-shadow: 0 30px 60px rgba(10, 25, 47, 0.08);
            position: relative;
            transform-style: preserve-3d;
            animation: slideUpFade 1s cubic-bezier(0.16, 1, 0.3, 1) 0.2s forwards;
            opacity: 0;
        }

        .contact-form-card::after {
            content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(800px circle at var(--mouse-x, 50%) var(--mouse-y, 50%), rgba(59, 130, 246, 0.05), transparent 40%);
            z-index: 0; pointer-events: none; opacity: 0; transition: opacity 0.4s; border-radius: 32px;
        }
        .contact-form-card:hover::after { opacity: 1; }

        .contact-form-card form, .form-title { position: relative; z-index: 1; transform: translateZ(30px); }

        .form-title {
            font-size: 2rem;
            font-weight: 800;
            margin-bottom: 2rem;
            color: var(--navy);
            letter-spacing: -0.5px;
        }

        .input-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.5rem;
            margin-bottom: 1.5rem;
        }

        input, textarea, select {
            width: 100%;
            padding: 1.2rem 1.5rem;
            border-radius: 16px;
            border: 1px solid #e2e8f0;
            background: rgba(255, 255, 255, 0.9);
            font-size: 1rem;
            font-family: 'Inter', sans-serif;
            color: var(--navy);
            transition: var(--transition);
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.02);
        }

        input::placeholder, textarea::placeholder { color: #94a3b8; }

        input:focus, textarea:focus, select:focus {
            outline: none;
            border-color: var(--skynet-blue);
            background: white;
            box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.15), inset 0 2px 4px rgba(0,0,0,0.02);
            transform: translateY(-2px);
        }

        select {
            appearance: none;
            background-image: url("data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22292.4%22%20height%3D%22292.4%22%3E%3Cpath%20fill%3D%22%230a192f%22%20d%3D%22M287%2069.4a17.6%2017.6%200%200%200-13-5.4H18.4c-5%200-9.3%201.8-12.9%205.4A17.6%2017.6%200%200%200%200%2082.2c0%205%201.8%209.3%205.4%2012.9l128%20127.9c3.6%203.6%207.8%205.4%2012.8%205.4s9.2-1.8%2012.8-5.4L287%2095c3.5-3.5%205.4-7.8%205.4-12.8%200-5-1.9-9.2-5.5-12.8z%22%2F%3E%3C%2Fsvg%3E");
            background-repeat: no-repeat;
            background-position: right 1.5rem top 50%;
            background-size: 0.65rem auto;
            margin-bottom: 1.5rem;
            cursor: pointer;
        }

        .btn-premium {
            background: var(--navy);
            color: white;
            padding: 1.2rem;
            border: none;
            border-radius: 50px;
            font-size: 1.1rem;
            font-weight: 800;
            cursor: pointer;
            width: 100%;
            transition: var(--transition);
            margin-top: 0.5rem;
            box-shadow: 0 10px 20px rgba(10, 25, 47, 0.15);
        }

        .btn-premium:hover {
            background: var(--skynet-blue);
            transform: translateY(-3px);
            box-shadow: 0 15px 30px rgba(59, 130, 246, 0.3);
        }

        /* --- RESPONSIVE LAYOUT --- */
        @media (max-width: 992px) {
            .contact-hero { grid-template-columns: 1fr; padding: 8rem 5% 4rem; gap: 50px; }
            .contact-form-card { padding: 2.5rem; }
        }
        @media (max-width: 600px) {
            .input-row { grid-template-columns: 1fr; gap: 1.5rem; }
            .hero-left h1 { font-size: 2.5rem; }
            .contact-form-card { padding: 2rem 1.5rem; border-radius: 24px; }
        }

        @keyframes slideUpFade { 
            0% { opacity: 0; transform: translateY(30px); } 
            100% { opacity: 1; transform: translateY(0); } 
        }
    </style>
</head>
<body>

    <div class="bg-glow top-left"></div>
    <div class="bg-glow bottom-right"></div>

    <main class="contact-hero">
        <!-- Left Side: Text and Contact Links -->
        <div class="hero-left">
            <h1>Let’s build your <br><span class="highlight">future together.</span></h1>
            <p class="hero-description">Have a question about UniMatcher® or need expert career guidance? Our team of academic consultants is ready to assist you.</p>
            
            <!-- WhatsApp Button (Styled with official green) -->
            <a href="https://wa.me/233209893750" class="contact-method target-3d-card" target="_blank" rel="noopener">
                <div class="icon-box" style="background: #eafff0; color: #25D366; box-shadow: 0 5px 15px rgba(37, 211, 102, 0.15);">
                    <svg xmlns="http://www.w3.org/2000/svg" width="30" height="30" fill="currentColor" viewBox="0 0 16 16">
                        <path d="M13.601 2.326A7.854 7.854 0 0 0 7.994 0C3.627 0 .068 3.558.064 7.926c-.003 1.396.366 2.76 1.057 3.965L0 16l4.204-1.102a7.933 7.933 0 0 0 3.79.965h.004c4.368 0 7.926-3.558 7.93-7.93A7.898 7.898 0 0 0 13.6 2.326zM7.994 14.521a6.573 6.573 0 0 1-3.356-.92l-.24-.144-2.494.654.666-2.433-.156-.251a6.56 6.56 0 0 1-1.007-3.505c0-3.626 2.957-6.584 6.591-6.584a6.56 6.56 0 0 1 4.66 1.931 6.557 6.557 0 0 1 1.928 4.66c-.004 3.639-2.961 6.592-6.592 6.592zm3.615-4.934c-.197-.099-1.17-.578-1.353-.646-.182-.065-.315-.099-.445.099-.133.197-.513.646-.627.775-.114.133-.232.148-.43.05-.197-.1-.836-.308-1.592-.985-.59-.525-.985-1.175-1.103-1.372-.114-.198-.011-.304.088-.403.087-.088.197-.232.296-.346.1-.114.133-.198.198-.33.065-.134.034-.248-.015-.347-.05-.099-.445-1.076-.612-1.47-.16-.389-.323-.335-.445-.34-.114-.007-.247-.007-.38-.007a.729.729 0 0 0-.529.247c-.182.198-.691.677-.691 1.654 0 .977.71 1.916.81 2.049.098.133 1.394 2.132 3.383 2.992.47.205.84.326 1.129.418.475.152.904.129 1.246.08.38-.058 1.171-.48 1.338-.943.164-.464.164-.86.114-.943-.049-.084-.182-.133-.38-.232z"/>
                    </svg>
                </div>
                <div>
                    <span style="display: block; font-weight: 800; font-size: 1.1rem; margin-bottom: 4px;">Chat on WhatsApp</span>
                    <span style="color: #64748b; font-size: 0.9rem;">Instant response during work hours</span>
                </div>
            </a>

            <!-- Email Button -->
            <a href="mailto:skynet1consult@gmail.com" class="contact-method target-3d-card">
                <div class="icon-box">✉️</div>
                <div>
                    <span style="display: block; font-weight: 800; font-size: 1.1rem; margin-bottom: 4px;">Email Support</span>
                    <span style="color: #64748b; font-size: 0.9rem;">skynet1consult@gmail.com</span>
                </div>
            </a>
        </div>

        <!-- Right Side: Interactive Glass Form -->
        <div class="contact-form-card target-3d-card">
            <h3 class="form-title">Send a Message</h3>
            
            <!-- WhatsApp Routing Form -->
            <form id="whatsappForm"> 
                <div class="input-row">
                    <input type="text" id="waName" placeholder="Full Name" required>
                    <input type="email" id="waEmail" placeholder="Email Address" required>
                </div>
                
                <select id="waSubject" required>
                    <option value="" disabled selected>Select a Subject...</option>
                    <option value="General Inquiry">General Inquiry</option>
                    <option value="UniMatcher Support">UniMatcher® Support</option>
                    <option value="Academic Consultation">Academic Consultation</option>
                    <option value="Voucher Purchase">Voucher Purchase</option>
                </select>

                <textarea id="waMessage" rows="5" placeholder="How can we help you achieve your goals?" required style="margin-bottom: 1.5rem; resize: vertical;"></textarea>
                
                <!-- Changed to WhatsApp Button Text -->
                <button type="submit" class="btn-premium">Send via WhatsApp →</button>
            </form>
        </div>
    </main>

    <!-- Global Layout Injector -->
    <script src="global.js"></script>
    
    <!-- WhatsApp Routing & 3D Physics Engine -->
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            
            /* ========================================================
               1. WHATSAPP FORM SUBMISSION LOGIC
               ======================================================== */
            const form = document.getElementById('whatsappForm');
            if(form) {
                form.addEventListener('submit', function(e) {
                    e.preventDefault();
                    
                    const name = document.getElementById('waName').value;
                    const email = document.getElementById('waEmail').value;
                    const subject = document.getElementById('waSubject').value;
                    const message = document.getElementById('waMessage').value;
                    
                    const whatsappNumber = "233209893750"; 
                    // %0A is the URL encoding for a line break
                    const formattedText = `*New SkyNet Consult Inquiry* 🚀%0A%0A*Name:* ${name}%0A*Email:* ${email}%0A*Subject:* ${subject}%0A%0A*Message:* ${message}`;
                    
                    window.open(`https://wa.me/${whatsappNumber}?text=${formattedText}`, '_blank');
                });
            }

            /* ========================================================
               2. 3D HOVER PHYSICS
               ======================================================== */
            try {
                const targets = document.querySelectorAll('.target-3d-card');

                const handleMouseMove = (e, element, intensity = 8) => {
                    const rect = element.getBoundingClientRect();
                    const x = e.clientX - rect.left;
                    const y = e.clientY - rect.top;
                    const centerX = rect.width / 2;
                    const centerY = rect.height / 2;
                    
                    const rotateX = ((y - centerY) / centerY) * -intensity;
                    const rotateY = ((x - centerX) / centerX) * intensity;
                    
                    element.style.transform = `perspective(1200px) rotateX(${rotateX}deg) rotateY(${rotateY}deg)`;
                    
                    element.style.setProperty('--mouse-x', `${x}px`);
                    element.style.setProperty('--mouse-y', `${y}px`);
                };

                const resetTransform = (element) => {
                    element.style.transform = 'perspective(1200px) rotateX(0deg) rotateY(0deg)';
                };

                targets.forEach(target => {
                    const isForm = target.classList.contains('contact-form-card');
                    const intensity = isForm ? 4 : 10;

                    target.addEventListener('mousemove', (e) => handleMouseMove(e, target, intensity));
                    target.addEventListener('mouseleave', () => resetTransform(target));
                });
            } catch (error) {
                console.error("Physics engine error:", error);
            }
        });
    </script>
</body>
</html>
