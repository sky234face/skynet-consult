<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Academic Hub | UniMatcher</title>
    <link rel="icon" type="image/png" href="/src/assets/unimatcher-logo.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script>
        tailwind.config = { 
            theme: { 
                extend: { 
                    colors: { brandBlue: '#003B73', brandOrange: '#F28C00' }, 
                    fontFamily: { sans: ['Plus Jakarta Sans', 'sans-serif'] } 
                } 
            } 
        }
    </script>
    <style>
        /* Force the body to never scroll sideways */
        html, body { 
            max-width: 100%; 
            overflow-x: hidden; 
            background: #f8fafc; 
            margin: 0; 
            padding: 0;
        }

        /* Responsive container for the grid */
        .grid-container {
            width: 100%;
            padding-left: 1rem;
            padding-right: 1rem;
            margin-left: auto;
            margin-right: auto;
        }

        .uni-card {
            width: 100%;
            border-radius: 1.5rem;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            background: white;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1);
        }
        .uni-card {
    display: flex;
    flex-direction: column;
    height: 100%; /* Ensures all cards in a row are same height */
    min-height: 500px;
}
#uni-grid {
    display: grid;
    align-items: stretch; /* Stretch cards to match height */
}

        .custom-scroll::-webkit-scrollbar { width: 4px; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        .filter-pill.active { background-color: #003B73; color: white; }
    </style>
</head>
<body class="text-slate-900">

    <div id="nav-placeholder"></div>

    <main class="py-8 md:py-16">
        <header class="px-6 mb-10 text-center">
            <h1 class="text-3xl md:text-5xl font-extrabold tracking-tight mb-3 text-brandBlue">
                Discover Your Future
            </h1>
            <p class="text-slate-500 text-sm font-medium">Real-time 2026 university cutoff standards.</p>
        </header>

        <div class="sticky top-4 z-40 px-4 mb-10 space-y-4">
            <div class="max-w-xl mx-auto relative">
                <input type="text" id="uni-search" placeholder="Search institution or program..." 
                    class="w-full pl-5 pr-12 py-4 bg-white border border-slate-200 rounded-2xl shadow-lg outline-none focus:border-brandBlue transition-all">
                <i class="fas fa-search absolute right-5 top-1/2 -translate-y-1/2 text-slate-400"></i>
            </div>

            <div class="flex items-center gap-2 overflow-x-auto pb-2 no-scrollbar justify-start md:justify-center">
                <button onclick="filterByCutoff('all', this)" class="filter-pill active whitespace-nowrap px-6 py-2 rounded-full bg-white border border-slate-200 text-[10px] font-bold uppercase tracking-wider transition-all">All</button>
                <button onclick="filterByCutoff('elite', this)" class="filter-pill whitespace-nowrap px-6 py-2 rounded-full bg-white border border-slate-200 text-[10px] font-bold uppercase tracking-wider transition-all">Competitive (6-10)</button>
                <button onclick="filterByCutoff('mid', this)" class="filter-pill whitespace-nowrap px-6 py-2 rounded-full bg-white border border-slate-200 text-[10px] font-bold uppercase tracking-wider transition-all">Standard (11-16)</button>
            </div>
        </div>

        <div class="grid-container">
            <div id="uni-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                <div class="col-span-full text-center py-20 text-slate-400">
                    <i class="fas fa-spinner animate-spin text-2xl mb-2"></i>
                    <p class="text-xs font-bold uppercase tracking-widest">Loading Institutions...</p>
                </div>
            </div>
        </div>
    </main>

    <script src="js/global.js"></script>
    <script>
    let masterData = [];
    const grid = document.getElementById('uni-grid');
    const searchInput = document.getElementById('uni-search');

    async function init() {
        try {
            const res = await fetch('https://api.unimatcher-skynetconsult.com/api/public/programs');
            masterData = await res.json();
            render(masterData);
        } catch (e) {
            grid.innerHTML = `<p class="col-span-full text-center py-20 text-red-500 font-bold">Network error. Please try again.</p>`;
        }
    }

function render(data) {
    if (!data.length) {
        grid.innerHTML = `<div class="col-span-full text-center py-20 text-slate-400 font-bold uppercase text-[10px]">No matches found</div>`;
        return;
    }

    // NEW LOGIC: Group by University AND Campus
    const grouped = data.reduce((acc, curr) => {
        const uni = curr.university_name || "Institution";
        const campus = curr.campus || "Main Campus";
        const groupKey = `${uni} | ${campus}`; // Create a unique key
        
        if (!acc[groupKey]) acc[groupKey] = { name: uni, campus: campus, programs: [] };
        acc[groupKey].programs.push(curr);
        return acc;
    }, {});

    grid.innerHTML = Object.entries(grouped).map(([key, info]) => `
        <div class="uni-card h-full">
            <div class="bg-brandBlue p-6 text-white relative">
                <div class="relative z-10">
                    <div class="flex justify-between items-start">
                        <span class="text-[8px] font-black uppercase tracking-widest bg-white/20 px-2 py-1 rounded mb-2 inline-block">Institution</span>
                        <span class="text-[8px] font-black uppercase tracking-widest bg-brandOrange px-2 py-1 rounded mb-2 inline-block">${info.programs.length} Programs</span>
                    </div>
                    <h2 class="text-xl font-bold leading-tight uppercase mb-1">${info.name}</h2>
                    <p class="text-blue-200 text-[10px] font-bold flex items-center">
                        <i class="fas fa-map-marker-alt text-brandOrange mr-2"></i> 
                        <span class="uppercase tracking-wider">${info.campus}</span>
                    </p>
                </div>
                <i class="fas fa-university absolute bottom-2 right-4 text-white/5 text-5xl"></i>
            </div>
            
            <div class="p-4 space-y-2 max-h-[400px] overflow-y-auto custom-scroll bg-slate-50 flex-grow">
                ${info.programs.sort((a, b) => parseInt(a.cutoff_aggregate) - parseInt(b.cutoff_aggregate)).map(p => {
                    const cutoff = parseInt(p.cutoff_aggregate);
                    const badgeColor = cutoff <= 10 ? 'bg-orange-500' : (cutoff <= 16 ? 'bg-brandBlue' : 'bg-emerald-500');
                    return `
                    <div class="flex items-center justify-between p-3 bg-white rounded-xl border border-slate-100 hover:border-brandOrange/30 transition-colors group">
                        <div class="flex-1 pr-3">
                            <h4 class="text-[10px] font-extrabold text-slate-800 leading-tight uppercase group-hover:text-brandBlue transition-colors">${p.program_name}</h4>
                            <div class="flex gap-2 mt-1">
                                <span class="text-[7px] text-slate-400 font-bold uppercase tracking-widest">WASSCE 2026</span>
                                <span class="text-[7px] text-brandOrange font-bold uppercase tracking-widest">${p.category || 'Regular'}</span>
                            </div>
                        </div>
                        <div class="${badgeColor} shadow-lg shadow-black/5 text-white w-9 h-9 shrink-0 flex flex-col items-center justify-center rounded-xl">
                            <span class="text-[7px] leading-none opacity-70 font-bold">CUTOFF</span>
                            <span class="text-xs leading-none font-black">${cutoff}</span>
                        </div>
                    </div>
                    `;
                }).join('')}
            </div>
            <div class="p-3 bg-white border-t border-slate-100 grid grid-cols-2 gap-2">
                <button onclick="window.location.href='eligibility.html?uni=${encodeURIComponent(info.name)}'" 
                    class="py-2.5 bg-slate-100 hover:bg-emerald-600 hover:text-white text-slate-600 text-[8px] font-black uppercase tracking-wider rounded-xl transition-all flex flex-col items-center justify-center gap-1 group">
                    <i class="fas fa-check-double text-[10px] group-hover:scale-110 transition-transform"></i>
                    Check Eligibility
                </button>

                <button onclick="window.location.href='discovery.html?uni=${encodeURIComponent(info.name)}&campus=${encodeURIComponent(info.campus)}'" 
                    class="py-2.5 bg-brandBlue text-white hover:bg-brandOrange text-[8px] font-black uppercase tracking-wider rounded-xl transition-all shadow-md shadow-brandBlue/10 flex flex-col items-center justify-center gap-1 group">
                    <i class="fas fa-wand-magic-sparkles text-[10px] group-hover:rotate-12 transition-transform"></i>
                    Pathfinder
                </button>
            </div>
        </div>
    `).join('');
}

    searchInput.addEventListener('input', (e) => {
        const term = e.target.value.toLowerCase();
        const filtered = masterData.filter(p => 
            p.university_name.toLowerCase().includes(term) || 
            p.program_name.toLowerCase().includes(term)
        );
        render(filtered);
    });

    window.filterByCutoff = (type, el) => {
        document.querySelectorAll('.filter-pill').forEach(b => b.classList.remove('active'));
        el.classList.add('active');
        let filtered = masterData;
        if (type === 'elite') filtered = masterData.filter(p => parseInt(p.cutoff_aggregate) <= 10);
        if (type === 'mid') filtered = masterData.filter(p => parseInt(p.cutoff_aggregate) > 10 && parseInt(p.cutoff_aggregate) <= 16);
        render(filtered);
    };

    init();
    </script>
</body>
</html>
