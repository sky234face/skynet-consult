<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account | UniMatcher</title>
    <link rel="icon" type="image/png" href="/src/assets/unimatcher-logo.png">
    <meta name="theme-color" content="#003B73">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: { 
                extend: { 
                    colors: { brandBlue: '#003B73', brandOrange: '#F28C00' }, 
                    fontFamily: { sans: ['Plus Jakarta Sans', 'sans-serif'] } 
                } 
            }
        }
    </script>
    <style>
        .glass-card { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        .animate-in { animation: slideUp 0.6s ease-out forwards; }
        /* Step visibility classes */
        .form-step { display: none; }
        .form-step-active { display: block; animation: slideUp 0.4s ease-out forwards; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen flex flex-col relative overflow-x-hidden selection:bg-brandBlue/10 selection:text-brandBlue">
    
    <div class="fixed top-0 left-0 w-full h-full -z-10 overflow-hidden">
        <div class="absolute -top-[10%] -left-[10%] w-[70%] md:w-[40%] h-[40%] bg-blue-200/50 rounded-full blur-[100px] animate-pulse"></div>
        <div class="absolute -bottom-[10%] -right-[10%] w-[70%] md:w-[40%] h-[40%] bg-orange-100/60 rounded-full blur-[100px]"></div>
    </div>

    <main class="flex-grow flex items-center justify-center p-4 md:p-6">
        <div class="max-w-md w-full animate-in">
            <div class="mb-6 md:mb-8 flex flex-col items-center">
                <div class="p-3 bg-white rounded-2xl shadow-xl shadow-blue-900/5 mb-4">
                    <img src="/src/assets/unimatcher-logo.png" alt="UniMatcher Logo" class="h-10 md:h-12">
                </div>
                <h2 class="text-brandBlue font-black text-2xl tracking-tight">UniMatcher</h2>
            </div>

            <div class="glass-card rounded-[2.5rem] p-8 md:p-10 shadow-2xl shadow-blue-900/10 border border-white">
                <div class="text-center mb-8">
                    <h1 class="text-2xl md:text-3xl font-black text-slate-900 tracking-tight">Create Account</h1>
                    <p id="step-description" class="text-slate-500 font-medium text-sm mt-1">Join thousands of students today.</p>
                </div>

                <form id="signup-form" class="space-y-4 md:space-y-5" novalidate>
                    
                    <div class="form-step form-step-active" data-step="1">
                        <div class="space-y-4">
                            <div class="space-y-2">
                                <label class="block text-[10px] font-black text-slate-400 uppercase tracking-[0.2em] px-1">Full Name</label>
                                <div class="relative group">
                                    <i class="fas fa-user absolute left-4 top-1/2 -translate-y-1/2 text-slate-300 group-focus-within:text-brandBlue transition-colors"></i>
                                    <input type="text" id="name" required class="w-full pl-11 pr-4 py-4 bg-slate-50/50 border border-slate-200 rounded-2xl outline-none focus:border-brandBlue focus:ring-4 focus:ring-brandBlue/5 transition-all font-semibold text-slate-700 placeholder:text-slate-300" placeholder="John Doe">
                                </div>
                            </div>
                            <div class="space-y-2">
                                <label class="block text-[10px] font-black text-slate-400 uppercase tracking-[0.2em] px-1">Email Address</label>
                                <div class="relative group">
                                    <i class="fas fa-envelope absolute left-4 top-1/2 -translate-y-1/2 text-slate-300 group-focus-within:text-brandBlue transition-colors"></i>
                                    <input type="email" id="email" required class="w-full pl-11 pr-4 py-4 bg-slate-50/50 border border-slate-200 rounded-2xl outline-none focus:border-brandBlue focus:ring-4 focus:ring-brandBlue/5 transition-all font-semibold text-slate-700 placeholder:text-slate-300" placeholder="name@example.com">
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="form-step" data-step="2">
                        <div class="space-y-2">
                            <label class="block text-[10px] font-black text-slate-400 uppercase tracking-[0.2em] px-1">Password</label>
                            <div class="relative group">
                                <i class="fas fa-lock absolute left-4 top-1/2 -translate-y-1/2 text-slate-300 group-focus-within:text-brandBlue transition-colors"></i>
                                <input type="password" id="password" required class="w-full pl-11 pr-12 py-4 bg-slate-50/50 border border-slate-200 rounded-2xl outline-none focus:border-brandBlue focus:ring-4 focus:ring-brandBlue/5 transition-all font-semibold text-slate-700 placeholder:text-slate-300" placeholder="••••••••">
                                <button type="button" id="togglePassword" class="absolute right-4 top-1/2 -translate-y-1/2 text-slate-400 hover:text-brandBlue transition-colors p-1">
                                    <i class="fas fa-eye" id="eyeIcon"></i>
                                </button>
                            </div>
                        </div>
                    </div>

                    <div class="form-step" data-step="3">
                        <div class="flex items-start gap-3 px-1 py-2">
                            <input type="checkbox" id="terms-check" required class="mt-1 w-4 h-4 accent-brandBlue rounded border-slate-300 cursor-pointer">
                            <p class="text-[11px] md:text-xs text-slate-500 leading-relaxed">
                                By signing up, I agree to the 
                                <button type="button" id="open-terms" class="text-brandBlue font-bold hover:underline">Terms</button> 
                                and 
                                <button type="button" id="open-privacy" class="text-brandBlue font-bold hover:underline">Privacy Policy</button>.
                            </p>
                        </div>
                    </div>

                    <div class="relative my-6" id="google-divider">
    <div class="absolute inset-0 flex items-center"><div class="w-full border-t border-slate-100"></div></div>
    <div class="relative flex justify-center text-[10px] uppercase tracking-widest font-black">
        <span class="bg-white px-4 text-slate-400">Or join with</span>
    </div>
</div>

<div id="g_id_onload"
     data-client_id="697854031778-90cqmvsv7ljud0iop4m3rtdjus1eo5id.apps.googleusercontent.com"
     data-context="signup"
     data-ux_mode="popup"
     data-callback="handleGoogleResponse"
     data-auto_prompt="false">
</div>

<div class="flex justify-center mb-6" id="google-btn-container">
    <div class="g_id_signin"
         data-type="standard"
         data-shape="pill"
         data-theme="outline"
         data-text="continue_with"
         data-size="large"
         data-logo_alignment="left"
         data-width="320">
    </div>
</div>
                    
                    <div class="flex gap-3">
                        <button type="button" id="back-btn" class="hidden w-1/3 py-4 bg-slate-100 text-slate-500 font-bold rounded-2xl hover:bg-slate-200 transition-all">Back</button>
                        <button type="submit" id="submit-btn" class="flex-grow py-4 bg-brandBlue text-white font-extrabold rounded-2xl shadow-xl shadow-blue-900/20 hover:bg-blue-800 active:scale-[0.98] transition-all flex items-center justify-center gap-3">
                            <span id="submit-btn-text">Continue to Step 2</span>
                            <i class="fas fa-arrow-right text-sm" id="submit-btn-icon"></i>
                        </button>
                    </div>

                    <div class="flex flex-col items-center gap-3 mt-6">
                        <div class="flex items-center gap-2">
                            <div id="dot-1" class="h-1.5 w-8 rounded-full bg-brandBlue transition-all"></div>
                            <div id="dot-2" class="h-1.5 w-8 rounded-full bg-slate-200 transition-all"></div>
                            <div id="dot-3" class="h-1.5 w-8 rounded-full bg-slate-200 transition-all"></div>
                        </div>
                        <span id="phase-text" class="text-[10px] font-black text-slate-400 uppercase tracking-widest">Setup Phase 1/3</span>
                    </div>
                </form>

                <div class="mt-8 pt-6 border-t border-slate-50 text-center">
                    <p class="text-slate-500 text-sm font-medium">Already have an account? <a href="login.html" class="text-brandBlue font-bold hover:underline underline-offset-4">Sign in</a></p>
                </div>
            </div>
        </div>
    </main>

    <div id="legal-modal" class="fixed inset-0 z-50 hidden flex items-center justify-center p-4">
        <div class="absolute inset-0 bg-slate-900/40 backdrop-blur-sm" id="modal-backdrop"></div>
        <div class="glass-card relative w-full max-w-lg max-h-[70vh] overflow-hidden rounded-[2.5rem] shadow-2xl border border-white flex flex-col animate-in">
            <div class="p-8 overflow-y-auto">
                <h2 id="modal-title" class="text-2xl font-black text-slate-900 mb-4"></h2>
                <div id="modal-content" class="text-sm text-slate-600 space-y-4 leading-relaxed"></div>
            </div>
            <div class="p-6 border-t border-slate-100 bg-white/50 flex justify-end">
                <button type="button" id="close-modal" class="px-8 py-3 bg-brandBlue text-white font-bold rounded-xl hover:bg-blue-800 transition-all">Got it</button>
            </div>
        </div>
    </div>

    <script>
// Replace lines 155-169 with this:
(function() {
    const urlParams = new URLSearchParams(window.location.search);
    const refFromUrl = urlParams.get('ref');

    if (refFromUrl) {
        localStorage.setItem('pending_referral', refFromUrl.toUpperCase().trim());
        // Report the click
        fetch('https://api.unimatcher-skynetconsult.com/api/admin/report-click', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ code: refFromUrl })
        }).catch(() => {}); 
    }
})();

// This function ensures we always get the most current code right before sending
const getActiveReferral = () => {
    const urlParams = new URLSearchParams(window.location.search);
    return urlParams.get('ref') || localStorage.getItem('pending_referral');
};
// 2. State Management
let currentStep = 1;
const totalSteps = 3;

const signupForm = document.getElementById('signup-form');
const formSteps = document.querySelectorAll('.form-step');
const backBtn = document.getElementById('back-btn');
const submitBtnText = document.getElementById('submit-btn-text');
const phaseText = document.getElementById('phase-text');
const description = document.getElementById('step-description');

// Modal Logic
const modal = document.getElementById('legal-modal');
const modalTitle = document.getElementById('modal-title');
const modalContent = document.getElementById('modal-content');
const closeModal = document.getElementById('close-modal');

const legalText = {
    terms: {
        title: "Terms of Service",
        body: `<p>Welcome to UniMatcher. By using our service, you agree to provide truthful info for university matching.</p>`
    },
    privacy: {
        title: "Privacy Policy",
        body: `<p>Your privacy is vital. We collect only what is necessary for your student profile.</p>`
    }
};

function updateSteps() {
    formSteps.forEach(step => step.classList.toggle('form-step-active', parseInt(step.dataset.step) === currentStep));
    
    for (let i = 1; i <= 3; i++) {
        document.getElementById(`dot-${i}`).className = i <= currentStep ? 'h-1.5 w-8 rounded-full bg-brandBlue transition-all' : 'h-1.5 w-8 rounded-full bg-slate-200 transition-all';
    }

    backBtn.classList.toggle('hidden', currentStep === 1);
    phaseText.innerText = `Setup Phase ${currentStep}/3`;
    
    const googleStuff = [document.getElementById('google-divider'), document.getElementById('google-btn-container')];
    googleStuff.forEach(el => { if (el) el.style.display = currentStep === 1 ? 'block' : 'none'; });

    if (currentStep === 1) { 
        submitBtnText.innerText = "Continue to Step 2"; 
        description.innerText = "Join thousands of students today."; 
    } else if (currentStep === 2) { 
        submitBtnText.innerText = "Continue to Final Step"; 
        description.innerText = "Secure your account."; 
    } else { 
        submitBtnText.innerText = "Create Account"; 
        description.innerText = "Almost done!"; 
    }
}

backBtn.addEventListener('click', () => { if (currentStep > 1) { currentStep--; updateSteps(); } });

// Toggle Password
document.getElementById('togglePassword').addEventListener('click', () => {
    const passwordInput = document.getElementById('password');
    const eyeIcon = document.getElementById('eyeIcon');
    const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
    passwordInput.setAttribute('type', type);
    eyeIcon.classList.toggle('fa-eye');
    eyeIcon.classList.toggle('fa-eye-slash');
});

// Modal Controls
document.getElementById('open-terms').onclick = () => { modalTitle.innerText = legalText.terms.title; modalContent.innerHTML = legalText.terms.body; modal.classList.remove('hidden'); };
document.getElementById('open-privacy').onclick = () => { modalTitle.innerText = legalText.privacy.title; modalContent.innerHTML = legalText.privacy.body; modal.classList.remove('hidden'); };
closeModal.onclick = () => modal.classList.add('hidden');

// 3. Final Signup Submission
signupForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    
    const activeStepEl = document.querySelector('.form-step-active');
    const stepInputs = activeStepEl.querySelectorAll('input');
    let isStepValid = true;

    stepInputs.forEach(input => {
        if (!input.checkValidity()) { input.reportValidity(); isStepValid = false; }
    });

    if (!isStepValid) return;

    if (currentStep < totalSteps) {
        currentStep++;
        updateSteps();
        return;
    }

    const btn = document.getElementById('submit-btn');
    const originalContent = btn.innerHTML;
    btn.disabled = true;
    btn.innerHTML = `<i class="fas fa-circle-notch animate-spin"></i> <span>Processing...</span>`;
    
    const payload = {
        name: document.getElementById('name').value,
        email: document.getElementById('email').value,
        password: document.getElementById('password').value,
        role: 'student',
        referralCode: getActiveReferral()
    };

    try {
        const res = await fetch('https://api.unimatcher-skynetconsult.com/api/signup', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        });
        const result = await res.json();

        if (res.ok) {
            localStorage.removeItem('pending_referral'); // Clean up
            localStorage.setItem('user_info', JSON.stringify({
                id: result.id,
                name: payload.name,
                email: payload.email,
                role: 'student'
            }));
            window.location.href = 'dashboard.html';
        } else {
            alert(result.error || "Signup failed.");
            btn.disabled = false;
            btn.innerHTML = originalContent;
        }
    } catch (err) {
        alert("Connection error.");
        btn.disabled = false;
        btn.innerHTML = originalContent;
    }
});

// 4. Google Auth Logic
async function handleGoogleResponse(response) {
    const btn = document.getElementById('submit-btn');
    btn.disabled = true;
    btn.innerHTML = `<i class="fas fa-circle-notch animate-spin"></i> <span>Verifying...</span>`;

    try {
        const res = await fetch('https://api.unimatcher-skynetconsult.com/api/auth/google', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ 
                credential: response.credential,
                referralCode: getActiveReferral()
            })
        });

        const result = await res.json();

        if (res.ok) {
            localStorage.removeItem('pending_referral'); // Clean up
            localStorage.setItem('user_info', JSON.stringify(result.user));
            window.location.href = 'dashboard.html';
        } else {
            alert(result.error || "Google Signup failed.");
            btn.disabled = false;
            btn.innerHTML = "Continue to Step 2";
        }
    } catch (err) {
        alert("Connection error during Google Sign-in.");
        btn.disabled = false;
    }
}
    </script>
</body>
</html>
