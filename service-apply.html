<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>University Admissions | SkyNet Consult</title>
    <link rel="icon" type="image/png" href="images/Skynet.png">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        /* =========================================
           BASE STYLES & VARIABLES
           ========================================= */
        :root {
            --navy: #0a192f;
            --skynet-blue: #3b82f6;
            --skynet-gradient: linear-gradient(135deg, #3b82f6, #06b6d4, #3b82f6);
            --white: #ffffff;
            --gray-100: #f8fafc;
            --glass-bg: rgba(255, 255, 255, 0.85);
            --glass-border: rgba(255, 255, 255, 0.5);
            --transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background-color: var(--gray-100); color: var(--navy); overflow-x: hidden; }

        /* --- ATMOSPHERIC BACKGROUND GLOWS --- */
        .bg-glow {
            position: absolute; width: 600px; height: 600px;
            background: radial-gradient(circle, rgba(59,130,246,0.12) 0%, rgba(255,255,255,0) 70%);
            border-radius: 50%; z-index: -1; pointer-events: none;
            animation: floatGlow 10s infinite alternate ease-in-out;
        }
        .bg-glow.top-left { top: -100px; left: -100px; }
        .bg-glow.bottom-right { bottom: 20%; right: -200px; animation-delay: -5s; }

        @keyframes floatGlow {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(50px, 50px) scale(1.1); }
        }

        /* --- HERO SECTION --- */
        .apply-hero {
            padding: 10rem 8% 4rem;
            text-align: center;
            position: relative;
            animation: slideUpFade 1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .apply-hero h1 {
            font-size: clamp(2.5rem, 5vw, 4rem);
            font-weight: 800;
            letter-spacing: -1.5px;
            margin-bottom: 1rem;
            color: var(--navy);
        }

        .highlight {
            background: var(--skynet-gradient);
            background-size: 200% auto;
            color: transparent;
            -webkit-background-clip: text;
            background-clip: text;
            animation: gradientText 4s linear infinite;
        }

        @keyframes gradientText {
            0% { background-position: 0% center; }
            100% { background-position: 200% center; }
        }

        .apply-hero p {
            font-size: 1.15rem;
            color: #64748b;
            max-width: 600px;
            margin: 0 auto;
            line-height: 1.7;
        }

        /* --- PREMIUM 3D FORM CONTAINER --- */
        .apply-container { 
            max-width: 750px; 
            margin: 0 auto 8rem; 
            padding: 0 5%; 
            perspective: 1200px;
        }

        .application-form {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 4rem;
            border-radius: 32px;
            border: 1px solid var(--glass-border);
            box-shadow: 0 30px 60px rgba(10, 25, 47, 0.08);
            position: relative;
            transform-style: preserve-3d;
            animation: slideUpFade 1s cubic-bezier(0.16, 1, 0.3, 1) 0.2s forwards;
            opacity: 0;
        }

        .application-form::after {
            content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(800px circle at var(--mouse-x, 50%) var(--mouse-y, 50%), rgba(59, 130, 246, 0.06), transparent 40%);
            z-index: 0; pointer-events: none; opacity: 0; transition: opacity 0.4s; border-radius: 32px;
        }
        .application-form:hover::after { opacity: 1; }
        
        .application-form > * { position: relative; z-index: 1; transform: translateZ(30px); }

        .form-header {
            border-bottom: 1px solid rgba(0,0,0,0.05);
            margin-bottom: 2.5rem;
            padding-bottom: 1.5rem;
        }

        .form-header h2 { 
            font-size: 1.5rem; 
            font-weight: 800; 
            color: var(--navy); 
            letter-spacing: -0.5px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.5rem;
        }

        .input-group { position: relative; }
        .full-width { grid-column: span 2; }

        .input-group label { 
            display: block; 
            font-weight: 700; 
            margin-bottom: 0.5rem; 
            color: var(--navy); 
            font-size: 0.85rem; 
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .input-group input {
            width: 100%;
            padding: 1.2rem 1.5rem;
            border-radius: 16px;
            border: 1px solid #e2e8f0;
            background: rgba(255, 255, 255, 0.9);
            font-size: 1rem;
            font-family: 'Inter', sans-serif;
            color: var(--navy);
            transition: var(--transition);
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.02);
        }

        .input-group input::placeholder { color: #94a3b8; }

        .input-group input:focus {
            outline: none;
            border-color: var(--skynet-blue);
            background: white;
            box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.15), inset 0 2px 4px rgba(0,0,0,0.02);
            transform: translateY(-2px);
        }

        /* --- UPGRADED SEARCH DROPDOWN --- */
        .search-results {
            position: absolute;
            top: calc(100% + 10px); 
            left: 0; 
            width: 100%;
            background: rgba(255, 255, 255, 0.95); 
            backdrop-filter: blur(15px);
            border-radius: 16px;
            box-shadow: 0 15px 40px rgba(10, 25, 47, 0.15);
            max-height: 250px; 
            overflow-y: auto;
            display: none; 
            z-index: 1000; 
            border: 1px solid rgba(59, 130, 246, 0.2);
            padding: 8px;
        }

        /* Custom Scrollbar for Dropdown */
        .search-results::-webkit-scrollbar { width: 8px; }
        .search-results::-webkit-scrollbar-track { background: transparent; }
        .search-results::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }

        .search-item {
            padding: 12px 16px;
            cursor: pointer;
            font-size: 0.95rem;
            font-weight: 500;
            color: var(--navy);
            border-radius: 10px;
            transition: 0.2s;
        }
        
        .search-item:hover { 
            background: var(--skynet-light); 
            color: var(--skynet-blue); 
            transform: translateX(5px);
        }

        /* --- PREMIUM BUTTON --- */
        .btn-submit {
            width: 100%;
            padding: 1.2rem;
            background: var(--navy);
            color: white;
            border: none;
            border-radius: 50px;
            font-size: 1.1rem;
            font-weight: 800;
            cursor: pointer;
            transition: var(--transition);
            margin-top: 1.5rem;
            box-shadow: 0 10px 20px rgba(10, 25, 47, 0.15);
        }

        .btn-submit:hover { 
            background: var(--skynet-blue); 
            transform: translateY(-3px); 
            box-shadow: 0 15px 30px rgba(59, 130, 246, 0.3);
        }

        @media (max-width: 768px) {
            .apply-hero { padding: 8rem 5% 3rem; }
            .form-grid { grid-template-columns: 1fr; gap: 1.2rem; }
            .full-width { grid-column: span 1; }
            .application-form { padding: 2.5rem 1.5rem; border-radius: 24px; }
        }

        @keyframes slideUpFade { 
            0% { opacity: 0; transform: translateY(30px); } 
            100% { opacity: 1; transform: translateY(0); } 
        }
    </style>
</head>
<body>

    <div class="bg-glow top-left"></div>
    <div class="bg-glow bottom-right"></div>

    <header class="apply-hero">
        <h1>Admission <span class="highlight">Inquiry</span></h1>
        <p>Complete the form below to begin your academic journey. Our matching experts will review your details immediately.</p>
    </header>

    <div class="apply-container">
        <form class="application-form target-3d-card" id="admissionForm" autocomplete="off">
            <div class="form-header">
                <h2>Candidate Information</h2>
            </div>

            <div class="form-grid">
                <div class="input-group full-width">
                    <label>Full Legal Name</label>
                    <input type="text" id="studentName" placeholder="Enter name exactly as it appears on results" required>
                </div>

                <div class="input-group">
                    <label>WhatsApp Number</label>
                    <input type="tel" id="studentPhone" placeholder="+233..." required>
                </div>

                <div class="input-group">
                    <label>Email Address</label>
                    <input type="email" id="studentEmail" placeholder="example@mail.com" required>
                </div>

                <div class="input-group full-width">
                    <label>Preferred Institution</label>
                    <input type="text" id="uniInput" placeholder="Search for university or college..." oninput="handleSearch(this)" required>
                    <div id="resultsBox" class="search-results"></div>
                </div>

                <div class="input-group full-width">
                    <label>Program of Interest</label>
                    <input type="text" id="programChoice" placeholder="e.g. Bachelor of Science in Nursing, Law, etc." required>
                </div>
            </div>

            <button type="submit" class="btn-submit">Submit Application Request →</button>
        </form>
    </div>

    <!-- Global Layout Injector -->
    <script src="global.js"></script>

    <script>
        /* ========================================================
           1. AUTOCOMPLETE SEARCH LOGIC
           ======================================================== */
        const institutions = [
            "University of Ghana (Legon)", "Kwame Nkrumah University of Science and Technology (KNUST)", "University of Cape Coast (UCC)", 
            "University for Development Studies (UDS)", "University of Professional Studies, Accra (UPSA)", "University of Education, Winneba (UEW)", "Ghana Institute of Management and Public Administration (GIMPA)",
            "Accra Technical University", "Kumasi Technical University", "Ho Technical University",
            "Valley View University", "Ashesi University", "Central University", 
            "Nursing & Midwifery Training College, Korle-Bu", "Nursing Training College, Kumasi"
        ];

        function handleSearch(input) {
            const resultsBox = document.getElementById('resultsBox');
            const val = input.value.toLowerCase();
            
            if (val.length < 1) { 
                resultsBox.style.display = 'none'; 
                return; 
            }

            const filtered = institutions.filter(item => item.toLowerCase().includes(val));

            if (filtered.length > 0) {
                resultsBox.innerHTML = filtered.map(item => 
                    // Using template literal for clean insertion
                    `<div class="search-item" onclick="selectItem(this)">${item}</div>`
                ).join('');
                resultsBox.style.display = 'block';
            } else {
                resultsBox.innerHTML = `<div class="search-item" style="color: #94a3b8; cursor: default;">No exact matches found. You can still type your preference.</div>`;
                resultsBox.style.display = 'block';
            }
        }

        function selectItem(element) {
            document.getElementById('uniInput').value = element.innerText;
            document.getElementById('resultsBox').style.display = 'none';
        }

        // Close dropdown when clicking outside
        document.addEventListener('click', function(e) {
            if (!document.getElementById('uniInput').contains(e.target)) {
                document.getElementById('resultsBox').style.display = 'none';
            }
        });

        /* ========================================================
           2. WHATSAPP SUBMISSION LOGIC
           ======================================================== */
        document.getElementById('admissionForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const name = document.getElementById('studentName').value;
            const phone = document.getElementById('studentPhone').value;
            const email = document.getElementById('studentEmail').value;
            const school = document.getElementById('uniInput').value;
            const program = document.getElementById('programChoice').value;

            // Note: This uses the number you provided in the script block
            const skynetWhatsApp = "233547933440"; 

            const message = `*New Admission Inquiry* 🎓%0A%0A*Name:* ${name}%0A*Phone:* ${phone}%0A*Email:* ${email}%0A*Institution:* ${school}%0A*Program:* ${program}%0A%0AI am ready to begin my application process.`;

            window.open(`https://wa.me/${skynetWhatsApp}?text=${message}`, '_blank');
        });

        /* ========================================================
           3. 3D HOVER PHYSICS
           ======================================================== */
        document.addEventListener("DOMContentLoaded", () => {
            try {
                const targets = document.querySelectorAll('.target-3d-card');

                const handleMouseMove = (e, element, intensity = 4) => {
                    const rect = element.getBoundingClientRect();
                    const x = e.clientX - rect.left;
                    const y = e.clientY - rect.top;
                    const centerX = rect.width / 2;
                    const centerY = rect.height / 2;
                    
                    const rotateX = ((y - centerY) / centerY) * -intensity;
                    const rotateY = ((x - centerX) / centerX) * intensity;
                    
                    element.style.transform = `perspective(1200px) rotateX(${rotateX}deg) rotateY(${rotateY}deg)`;
                    
                    // Updates inner glow
                    element.style.setProperty('--mouse-x', `${x}px`);
                    element.style.setProperty('--mouse-y', `${y}px`);
                };

                const resetTransform = (element) => {
                    element.style.transform = 'perspective(1200px) rotateX(0deg) rotateY(0deg)';
                };

                targets.forEach(target => {
                    target.addEventListener('mousemove', (e) => handleMouseMove(e, target, 3)); // Gentle tilt for large forms
                    target.addEventListener('mouseleave', () => resetTransform(target));
                });
            } catch (error) {
                console.error("Physics engine error:", error);
            }
        });
    </script>
</body>
</html>
