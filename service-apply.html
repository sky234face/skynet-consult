<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>University Admissions | SkyNet Consult</title>
    <link rel="icon" type="image/png" href="images/Skynet.png">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    
    <style>
        :root {
            --primary-navy: #0a192f;
            --accent-blue: #00d2ff;
            --text-gray: #64748b;
            --input-bg: #f8fafc;
        }

        body { 
            background: #ffffff; 
            color: var(--primary-navy);
            overflow-x: hidden;
        }

        .apply-hero {
            padding: 120px 8% 60px;
            text-align: center;
            background: linear-gradient(180deg, #f0f7ff 0%, #ffffff 100%);
        }

        .apply-hero h1 {
            font-size: 2.8rem;
            font-weight: 800;
            letter-spacing: -1px;
            margin-bottom: 10px;
        }

        /* --- CLASSIC FORM CONTAINER --- */
        .apply-container { 
            max-width: 700px; 
            margin: 0 auto 100px; 
            padding: 0 20px; 
        }

        .application-form {
            background: #ffffff;
            padding: 50px;
            border-radius: 24px;
            border: 1px solid #e2e8f0;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.05);
        }

        .form-header {
            border-bottom: 1px solid #f1f5f9;
            margin-bottom: 40px;
            padding-bottom: 20px;
        }

        .form-header h2 { font-size: 1.25rem; font-weight: 700; color: var(--primary-navy); }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .input-group { margin-bottom: 25px; position: relative; }
        .full-width { grid-column: span 2; }

        .input-group label { 
            display: block; 
            font-weight: 600; 
            margin-bottom: 8px; 
            color: var(--primary-navy); 
            font-size: 0.85rem; 
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .input-group input {
            width: 100%;
            padding: 15px 20px;
            border-radius: 12px;
            border: 1.5px solid #e2e8f0;
            background: var(--input-bg);
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        .input-group input:focus {
            outline: none;
            border-color: var(--accent-blue);
            background: #fff;
            box-shadow: 0 0 0 4px rgba(0, 210, 255, 0.1);
        }

        /* --- SEARCH DROPDOWN --- */
        .search-results {
            position: absolute;
            top: 100%; left: 0; width: 100%;
            background: white; border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            max-height: 250px; overflow-y: auto;
            display: none; z-index: 100; border: 1px solid #e2e8f0;
        }

        .search-item {
            padding: 12px 20px;
            cursor: pointer;
            font-size: 0.95rem;
            border-bottom: 1px solid #f8fafc;
        }
        .search-item:hover { background: #f0f9ff; color: var(--accent-blue); }

        .btn-submit {
            width: 100%;
            padding: 18px;
            background: var(--primary-navy);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 10px;
        }
        .btn-submit:hover { background: var(--accent-blue); transform: translateY(-2px); }

        @media (max-width: 600px) {
            .form-grid { grid-template-columns: 1fr; }
            .full-width { grid-column: span 1; }
            .application-form { padding: 30px 20px; }
        }
    </style>
</head>
<body>

    <header class="apply-hero">
        <h1>Admission <span style="color:var(--accent-blue)">Inquiry</span></h1>
        <p style="color:var(--text-gray)">Complete the form below to begin your academic journey.</p>
    </header>

    <div class="apply-container">
        <form class="application-form" id="admissionForm" autocomplete="off">
            <div class="form-header">
                <h2>Candidate Information</h2>
            </div>

            <div class="form-grid">
                <div class="input-group full-width">
                    <label>Full Legal Name</label>
                    <input type="text" id="studentName" placeholder="Enter name as it appears on results" required>
                </div>

                <div class="input-group">
                    <label>WhatsApp Number</label>
                    <input type="tel" id="studentPhone" placeholder="+233..." required>
                </div>

                <div class="input-group">
                    <label>Email Address</label>
                    <input type="email" id="studentEmail" placeholder="example@mail.com">
                </div>

                <div class="input-group full-width">
                    <label>Preferred Institution</label>
                    <input type="text" id="uniInput" placeholder="Search for university or college..." oninput="handleSearch(this)" required>
                    <div id="resultsBox" class="search-results"></div>
                </div>

                <div class="input-group full-width">
                    <label>Program of Interest</label>
                    <input type="text" id="programChoice" placeholder="e.g. Bachelor of Science in Nursing" required>
                </div>
            </div>

            <button type="submit" class="btn-submit">Submit Application Request</button>
        </form>
    </div>

    <script>
        const institutions = [
            "University of Ghana (Legon)", "KNUST", "University of Cape Coast (UCC)", 
            "UDS (Tamale)", "UPSA", "University of Education (UEW)", "GIMPA",
            "Accra Technical University", "Kumasi Technical University", "Ho Technical University",
            "Valley View University", "Ashesi University", "Central University", 
            "Nursing & Midwifery Training College, Korle-Bu", "Nursing Training College, Kumasi"
        ];

        function handleSearch(input) {
            const resultsBox = document.getElementById('resultsBox');
            const val = input.value.toLowerCase();
            if (val.length < 1) { resultsBox.style.display = 'none'; return; }

            const filtered = institutions.filter(item => item.toLowerCase().includes(val));

            if (filtered.length > 0) {
                resultsBox.innerHTML = filtered.map(item => 
                    `<div class="search-item" onclick="selectItem('${item}')">${item}</div>`
                ).join('');
                resultsBox.style.display = 'block';
            } else {
                resultsBox.style.display = 'none';
            }
        }

        function selectItem(name) {
            document.getElementById('uniInput').value = name;
            document.getElementById('resultsBox').style.display = 'none';
        }

        // --- SUBMISSION LOGIC (The "Where does it go?" part) ---
        document.getElementById('admissionForm').addEventListener('submit', function(e) {
            e.preventDefault();

            // Collect Data
            const name = document.getElementById('studentName').value;
            const phone = document.getElementById('studentPhone').value;
            const school = document.getElementById('uniInput').value;
            const program = document.getElementById('programChoice').value;

            // Skynet Consult WhatsApp Number
            const skynetWhatsApp = "233547933440"; // REPLACE THIS with your real business number

            // Construct the Message
            const message = `Hello Skynet Consult,%0A%0AI would like to apply for admission.%0A%0A*Name:* ${name}%0A*Phone:* ${phone}%0A*Institution:* ${school}%0A*Program:* ${program}`;

            // Redirect to WhatsApp
            window.open(`https://wa.me/${skynetWhatsApp}?text=${message}`, '_blank');
        });

        document.addEventListener('click', function(e) {
            if (!document.getElementById('uniInput').contains(e.target)) {
                document.getElementById('resultsBox').style.display = 'none';
            }
        });
    </script>
    <script src="global.js"></script>
</body>
</html>
