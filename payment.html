<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Payment | UniMatcher Hub</title>
    <link rel="icon" type="image/png" href="/src/assets/unimatcher-logo.png">
    <script src="https://js.paystack.co/v2/inline.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: { extend: { colors: { brandBlue: '#003B73', brandOrange: '#F28C00' }, fontFamily: { sans: ['Plus Jakarta Sans', 'sans-serif'] } } }
        }
    </script>
</head>
<body class="bg-[#f8fafc] min-h-screen flex items-center justify-center p-4">
    <div class="max-w-md w-full bg-white rounded-[2.5rem] shadow-2xl border border-white overflow-hidden relative">
        <div class="bg-brandBlue p-8 text-center text-white">
            <h1 id="checkout-title" class="text-xl font-extrabold tracking-tight">Checkout</h1>
            <p class="text-blue-200 text-xs font-medium uppercase tracking-widest mt-2">Verification Fee</p>
        </div>

        <div class="p-8 space-y-6 text-center">
            <div class="bg-slate-50 rounded-2xl p-6 border border-slate-100">
                <p class="text-slate-500 text-xs font-bold uppercase mb-1" id="display-prog">Academic Discovery</p>
                <span class="text-3xl font-black text-slate-900 amount-display">GHS 10.00</span>
            </div>

            <button type="button" id="pay-button" class="w-full py-5 bg-brandOrange text-white font-black rounded-2xl shadow-xl hover:scale-[1.02] transition-all flex items-center justify-center gap-3">
                <i class="fas fa-lock text-sm opacity-50"></i>
                <span>PAY NOW</span>
            </button>

            <p class="text-[10px] text-slate-400 font-bold uppercase">Secured by Paystack</p>
        </div>

        <div id="loader" class="hidden absolute inset-0 bg-white/95 z-50 flex flex-col items-center justify-center p-10 text-center">
            <div class="w-16 h-16 border-4 border-slate-100 border-t-brandOrange rounded-full animate-spin mb-6"></div>
            <h3 class="text-lg font-black text-slate-800">Verifying Payment...</h3>
            <p class="text-sm text-slate-500 mt-2">Please do not close this window.</p>
        </div>
    </div>

    <script src="js/payment.js"></script>
</body>
</html>
