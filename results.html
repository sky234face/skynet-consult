<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admission Audit | UniMatcher</title>
    <link rel="icon" type="image/png" href="src/assets/unimatcher-logo.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: { extend: { colors: { brandBlue: '#003B73', brandOrange: '#F28C00' }, fontFamily: { sans: ['Plus Jakarta Sans', 'sans-serif'] } } }
        }
    </script>
    <style>
        /* 1. Official Stamp Design - Adjusted for Mobile */
        .verified-stamp {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 100px; /* Smaller on mobile */
            height: 100px;
            border: 4px double #059669;
            border-radius: 50%;
            color: #059669;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            font-weight: 900;
            text-transform: uppercase;
            transform: rotate(-15deg);
            opacity: 0.15;
            pointer-events: none;
            z-index: 50;
            font-family: 'Courier New', Courier, monospace;
        }
        @media (min-width: 768px) {
            .verified-stamp { width: 130px; height: 130px; top: 40px; right: 40px; }
        }
        .verified-stamp::after {
            content: "VERIFIED\A&OFFICIAL";
            white-space: pre;
            font-size: 0.8rem;
            line-height: 1;
        }
        @media (min-width: 768px) { .verified-stamp::after { font-size: 1.1rem; } }

        /* 2. Professional Print Lockdown */
        @media print {
            .no-print, #action-buttons, .nav-btn, button { display: none !important; }
            body { background: white !important; }
            #results-container { 
                width: 100% !important; 
                max-width: none !important; 
                box-shadow: none !important; 
                padding: 0 !important;
                margin: 0 !important;
            }
            .match-card { 
                page-break-inside: avoid !important; 
                border: 1px solid #e2e8f0 !important;
                margin-bottom: 30px !important;
            }
            @page { size: A4 portrait; margin: 15mm; }
        }
    </style>
</head>
<body class="bg-slate-50 min-h-screen">
    <div class="max-w-4xl mx-auto px-6 pt-6 no-print">
        <a href="dashboard.html" class="inline-flex items-center gap-2 text-slate-500 hover:text-brandBlue font-extrabold transition-colors py-2">
            <i class="fas fa-arrow-left text-sm"></i> Back to Dashboard
        </a>
    </div>

    <main id="results-container" class="w-full max-w-4xl mx-auto px-4 sm:px-10 py-8 md:py-16 bg-white min-h-screen shadow-2xl relative">
        
        <div id="pdf-watermark" class="verified-stamp hidden"></div>

        <div id="pro-header" class="hidden border-b-4 border-brandBlue pb-8 mb-10 flex flex-col md:flex-row md:justify-between md:items-end gap-6">
            <div>
                <img src="src/assets/unimatcher-logo.png" class="h-10 md:h-12 mb-4" alt="UniMatcher Logo">
                <h2 class="text-xl md:text-2xl font-black text-brandBlue uppercase tracking-tight">Admission Audit Report</h2>
            </div>
            <div class="text-left md:text-right text-[10px] md:text-[11px] font-bold text-slate-500 uppercase tracking-widest leading-relaxed">
                <p>Student: <span id="pdf-student-name" class="text-slate-900">---</span></p>
                <p>Date: <span id="pdf-date" class="text-slate-900">---</span></p>
                <p>Ref: <span id="pdf-report-id" class="text-brandOrange">---</span></p>
            </div>
        </div>

        <div id="loader" class="text-center py-20">
            <i class="fas fa-circle-notch animate-spin text-4xl text-brandBlue mb-4"></i>
            <p class="text-slate-500 font-bold uppercase tracking-widest text-xs">Analysing Requirements...</p>
        </div>

        <div id="header-section" class="hidden mb-10 border-l-4 border-brandOrange pl-4 md:pl-6 py-2">
            <h1 class="text-2xl md:text-3xl font-black text-slate-900 leading-tight">Eligibility Results</h1>
            <p class="text-slate-500 font-medium text-sm">Evaluation based on National Admissions Standards.</p>
        </div>

        <div id="matches-grid" class="hidden grid gap-6 md:gap-8 relative z-10"></div>
        
        <div id="pdf-footer" class="hidden mt-16 pt-8 border-t border-slate-100 flex flex-col md:flex-row justify-between items-center gap-4">
            <div class="flex items-center gap-2 px-4 py-2 bg-emerald-50 text-emerald-700 rounded-lg text-[10px] font-black uppercase tracking-widest">
                <i class="fas fa-check-shield"></i> Verified Authentic
            </div>
            <p class="text-[9px] text-slate-400 font-bold uppercase tracking-widest">UniMatcher Hub — 2026 Official Audit</p>
        </div>
    </main>

    <div id="action-buttons" class="hidden max-w-4xl mx-auto px-6 py-10 flex flex-col sm:flex-row gap-4 justify-center">
        <button onclick="window.downloadPDF()" class="w-full sm:w-auto px-8 py-4 bg-brandBlue text-white rounded-2xl font-black text-sm uppercase tracking-widest shadow-xl active:scale-95 transition-all">
            <i class="fas fa-print mr-2"></i> Print / Save PDF
        </button>
        <button onclick="shareToWhatsApp()" 
        class="flex items-center justify-center gap-2 bg-[#25D366] hover:bg-[#20ba5a] text-white font-bold py-3 px-6 rounded-2xl shadow-lg shadow-green-900/20 transition-all active:scale-95">
    <i class="fab fa-whatsapp text-xl"></i>
    <span>Share Results to WhatsApp</span>
</button>
    </div>

    <script src="js/results.js"></script>
</body>
</html>
