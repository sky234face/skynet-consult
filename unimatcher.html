<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UniMatcher® | Launching June 1st</title>
    <link rel="icon" type="image/png" href="images/Skynet.png">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
    
    <style>
        /* =========================================
           BASE STYLES & VARIABLES
           ========================================= */
        :root {
            --dark-bg: #020617; /* Deep premium obsidian */
            --uni-blue: #3b82f6;
            --uni-blue-glow: rgba(59, 130, 246, 0.5);
            --uni-orange: #f59e0b;
            --glass: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.08);
            --transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        /* --- LAYOUT OVERRIDES --- */
        /* Neutralizes any global.js sidebars so the squeeze page is perfectly centered */
        aside, .sidebar, #sidebar, [class*="sidebar"] { display: none !important; width: 0 !important; position: absolute !important; visibility: hidden !important; }
        
        body, html { margin: 0; padding: 0; overflow-x: hidden; width: 100%; height: 100%; }

        body {
            background-color: var(--dark-bg);
            color: white;
            font-family: 'Inter', sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        /* --- MAIN WRAPPER & ATMOSPHERE --- */
        .coming-soon-wrapper {
            min-height: 100vh;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
            position: relative;
            text-align: center;
            box-sizing: border-box;
            z-index: 1;
        }

        .ambient-glow {
            position: absolute;
            top: -20%;
            left: 50%;
            transform: translateX(-50%);
            width: 80vw;
            max-width: 800px;
            height: 600px;
            background: radial-gradient(circle, rgba(59,130,246,0.15) 0%, transparent 60%);
            z-index: -1;
            animation: pulseGlow 8s infinite alternate ease-in-out;
            pointer-events: none;
        }

        @keyframes pulseGlow {
            0% { opacity: 0.6; transform: translateX(-50%) scale(0.9); }
            100% { opacity: 1; transform: translateX(-50%) scale(1.1); }
        }

        /* --- ENTRANCE ANIMATIONS --- */
        .fade-in-up {
            opacity: 0;
            animation: fadeInUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        .delay-1 { animation-delay: 0.1s; }
        .delay-2 { animation-delay: 0.2s; }
        .delay-3 { animation-delay: 0.3s; }
        .delay-4 { animation-delay: 0.4s; }

        @keyframes fadeInUp {
            0% { opacity: 0; transform: translateY(30px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        /* --- TYPOGRAPHY & BADGE --- */
        .status-badge {
            display: inline-block;
            background: rgba(245, 158, 11, 0.1);
            border: 1px solid rgba(245, 158, 11, 0.3);
            color: var(--uni-orange);
            padding: 8px 24px;
            border-radius: 100px;
            font-size: 12px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 30px;
            box-shadow: 0 0 20px rgba(245, 158, 11, 0.1);
        }

        .main-title {
            font-size: clamp(2.5rem, 8vw, 4.5rem);
            font-weight: 900;
            line-height: 1.05;
            margin: 0 0 20px 0;
            letter-spacing: -1.5px;
        }

        .gradient-text {
            background: linear-gradient(180deg, #ffffff 20%, #94a3b8 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .sub-text {
            color: #94a3b8;
            font-size: clamp(15px, 4vw, 18px);
            max-width: 550px;
            margin: 0 auto 40px;
            line-height: 1.6;
        }

        /* --- COUNTDOWN ENGINE --- */
        .countdown-grid {
            display: flex;
            justify-content: center;
            gap: clamp(15px, 4vw, 40px);
            margin-bottom: 50px;
        }

        .time-box {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .time-box span {
            display: flex;
            align-items: center;
            justify-content: center;
            width: clamp(60px, 12vw, 90px);
            height: clamp(70px, 14vw, 100px);
            background: var(--glass);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            font-size: clamp(28px, 6vw, 42px);
            font-weight: 900;
            color: white;
            box-shadow: inset 0 2px 10px rgba(255,255,255,0.02), 0 10px 30px rgba(0,0,0,0.2);
            margin-bottom: 10px;
        }

        .time-box label {
            font-size: 11px;
            font-weight: 700;
            color: var(--uni-blue);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* --- 3D PREMIUM IMAGE SHOWCASE --- */
        .preview-showcase {
            position: relative;
            width: 100%;
            max-width: 600px;
            height: 280px;
            margin: 0 auto 50px;
            perspective: 1200px;
            display: flex;
            justify-content: center;
            z-index: 10;
        }

        .showcase-wrapper {
            position: relative;
            width: 100%;
            height: 100%;
            transform-style: preserve-3d;
            transition: transform 0.1s ease-out;
        }

        .preview-img {
            position: absolute;
            width: 75%;
            border-radius: 16px;
            border: 1px solid var(--glass-border);
            left: 50%;
            transition: var(--transition);
        }

        /* Back Image (Blurred & Faded) */
        .img-back {
            top: 0;
            transform: translateX(-60%) translateZ(-40px);
            opacity: 0.3;
            filter: blur(8px);
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
        }

        /* Front Image (Sharp & Glowing) */
        .img-front {
            top: 30px;
            transform: translateX(-40%) translateZ(40px);
            opacity: 1;
            box-shadow: 0 30px 60px rgba(0,0,0,0.6), 0 0 40px rgba(59, 130, 246, 0.1);
        }

        .showcase-wrapper:hover .img-back { opacity: 0.5; filter: blur(4px); transform: translateX(-65%) translateZ(-50px); }
        .showcase-wrapper:hover .img-front { transform: translateX(-35%) translateZ(60px); box-shadow: 0 40px 80px rgba(0,0,0,0.8), 0 0 60px rgba(59, 130, 246, 0.2); }

        /* --- HIGH-END NOTIFY FORM --- */
        .notify-form {
            background: rgba(255, 255, 255, 0.02);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 8px;
            border-radius: 20px;
            border: 1px solid var(--glass-border);
            display: flex;
            width: 100%;
            max-width: 450px;
            margin: 0 auto;
            transition: var(--transition);
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
        }

        .notify-form:focus-within {
            border-color: rgba(59, 130, 246, 0.4);
            box-shadow: 0 20px 40px rgba(0,0,0,0.2), 0 0 0 4px rgba(59, 130, 246, 0.1);
        }

        .notify-form input {
            background: transparent;
            border: none;
            color: white;
            padding: 15px 20px;
            flex: 1;
            outline: none;
            font-size: 16px;
        }

        .notify-form input::placeholder { color: #64748b; }

        .btn-launch {
            background: var(--uni-blue);
            color: white;
            border: none;
            padding: 0 25px;
            border-radius: 14px;
            font-weight: 700;
            font-size: 15px;
            cursor: pointer;
            transition: var(--transition);
            box-shadow: 0 10px 20px rgba(59, 130, 246, 0.2);
        }

        .btn-launch:hover {
            background: #2563eb;
            transform: translateY(-2px);
            box-shadow: 0 15px 30px rgba(59, 130, 246, 0.4);
        }

        /* --- MOBILE RESPONSIVE --- */
        @media (max-width: 600px) {
            .preview-showcase { height: 180px; margin-bottom: 30px; }
            .img-front { top: 20px; width: 85%; }
            .img-back { width: 85%; }
            .notify-form { flex-direction: column; background: transparent; border: none; gap: 12px; box-shadow: none; padding: 0; }
            .notify-form:focus-within { box-shadow: none; border-color: transparent; }
            .notify-form input { background: rgba(255, 255, 255, 0.03); border: 1px solid var(--glass-border); border-radius: 16px; width: 100%; box-sizing: border-box; }
            .btn-launch { width: 100%; padding: 18px; border-radius: 16px; }
        }
    </style>
</head>
<body>

    <main class="coming-soon-wrapper">
        <div class="ambient-glow"></div>

        <div class="status-badge fade-in-up">Launching June 1st</div>
        
        <h1 class="main-title fade-in-up delay-1">
            <span class="gradient-text">The Future of</span><br>
            <span style="color: var(--uni-blue);">Academic Matching.</span>
        </h1>

        <p class="sub-text fade-in-up delay-1">
            We're upgrading UniMatcher® with the 2026 university requirements. 
            Get ready for the most accurate, data-driven placement tool in Ghana.
        </p>

        <!-- Dynamic JS Countdown -->
        <div class="countdown-grid fade-in-up delay-2">
            <div class="time-box">
                <span id="days">00</span>
                <label>Days</label>
            </div>
            <div class="time-box">
                <span id="hours">00</span>
                <label>Hours</label>
            </div>
            <div class="time-box">
                <span id="minutes">00</span>
                <label>Mins</label>
            </div>
            <div class="time-box">
                <span id="seconds">00</span>
                <label>Secs</label>
            </div>
        </div>

        <!-- 3D Image Showcase -->
        <div class="preview-showcase fade-in-up delay-3 target-3d-card">
            <div class="showcase-wrapper">
                <img src="images/dash.png" class="preview-img img-back" alt="Dashboard Background">
                <img src="images/UI UniMatcher.png" class="preview-img img-front" alt="UniMatcher Interface">
            </div>
        </div>

        <!-- Notification Capture -->
        <form class="notify-form fade-in-up delay-4" onsubmit="event.preventDefault(); alert('You are on the list! We will notify you on June 1st.');">
            <input type="email" placeholder="Enter your email address..." required>
            <button type="submit" class="btn-launch">Get Early Access</button>
        </form>
    </main>

    <!-- Global layout logic -->
    <script src="global.js"></script>
    
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            /* ========================================================
               1. COUNTDOWN TIMER ENGINE (TARGET: JUNE 1, 2026)
               ======================================================== */
            const targetDate = new Date("June 1, 2026 00:00:00").getTime();

            const timer = setInterval(function() {
                const now = new Date().getTime();
                const distance = targetDate - now;

                if (distance < 0) {
                    clearInterval(timer);
                    document.querySelector(".countdown-grid").innerHTML = "<h3 style='font-size: 2rem; color: var(--uni-blue); font-weight: 900;'>WE ARE LIVE!</h3>";
                    return;
                }

                const d = Math.floor(distance / (1000 * 60 * 60 * 24));
                const h = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                const m = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
                const s = Math.floor((distance % (1000 * 60)) / 1000);

                document.getElementById("days").innerText = d.toString().padStart(2, '0');
                document.getElementById("hours").innerText = h.toString().padStart(2, '0');
                document.getElementById("minutes").innerText = m.toString().padStart(2, '0');
                document.getElementById("seconds").innerText = s.toString().padStart(2, '0');
            }, 1000);

            /* ========================================================
               2. 3D HOVER PHYSICS FOR SHOWCASE
               ======================================================== */
            try {
                const targetCards = document.querySelectorAll('.target-3d-card');

                const handleMouseMove = (e, element, intensity = 20) => {
                    const wrapper = element.querySelector('.showcase-wrapper');
                    if(!wrapper) return;

                    const rect = element.getBoundingClientRect();
                    const x = e.clientX - rect.left;
                    const y = e.clientY - rect.top;
                    const centerX = rect.width / 2;
                    const centerY = rect.height / 2;
                    
                    const rotateX = ((y - centerY) / centerY) * -intensity;
                    const rotateY = ((x - centerX) / centerX) * intensity;
                    
                    wrapper.style.transform = `perspective(1200px) rotateX(${rotateX}deg) rotateY(${rotateY}deg)`;
                };

                const resetTransform = (element) => {
                    const wrapper = element.querySelector('.showcase-wrapper');
                    if(wrapper) wrapper.style.transform = 'perspective(1200px) rotateX(0deg) rotateY(0deg)';
                };

                targetCards.forEach(card => {
                    card.addEventListener('mousemove', (e) => handleMouseMove(e, card, 15));
                    card.addEventListener('mouseleave', () => resetTransform(card));
                });
            } catch (error) {
                console.error("Physics engine error:", error);
            }
        });
    </script>
</body>
</html>
