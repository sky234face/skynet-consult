<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UniMatcher | Launching April 1st</title>
    <link rel="icon" type="image/png" href="images/Skynet.png">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --dark-bg: #020617;
            --uni-blue: #3b82f6;
            --uni-orange: #f59e0b;
            --glass: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.1);
        }

        body {
            background-color: var(--dark-bg);
            color: white;
            margin: 0;
            overflow-x: hidden;
            font-family: 'Inter', sans-serif;
        }

        /* --- WRAPPER --- */
        .coming-soon-wrapper {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 80px 5%;
            position: relative;
            text-align: center;
            box-sizing: border-box;
        }

        .glow-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 50% 0%, rgba(59, 130, 246, 0.15) 0%, transparent 50%),
                        radial-gradient(circle at 80% 80%, rgba(245, 158, 11, 0.08) 0%, transparent 50%);
            z-index: -1;
        }

        /* --- BADGE & TITLES --- */
        .status-badge {
            background: rgba(245, 158, 11, 0.1);
            border: 1px solid var(--uni-orange);
            color: var(--uni-orange);
            padding: 8px 24px;
            border-radius: 100px;
            font-size: clamp(10px, 3vw, 13px);
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 3px;
            margin-bottom: 20px;
            display: inline-block;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .main-title {
            font-size: clamp(2rem, 8vw, 4.5rem);
            font-weight: 900;
            letter-spacing: -2px;
            line-height: 1.1;
            margin: 0 0 20px 0;
        }

        .gradient-text {
            background: linear-gradient(180deg, #fff 30%, #94a3b8 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .sub-text {
            color: #94a3b8;
            font-size: clamp(16px, 4vw, 19px);
            max-width: 600px;
            margin: 0 auto 40px;
            line-height: 1.6;
        }

        /* --- COUNTDOWN --- */
        .countdown-grid {
            display: flex;
            justify-content: center;
            gap: clamp(15px, 5vw, 40px);
            margin-bottom: 50px;
        }

        .time-box span {
            display: block;
            font-size: clamp(28px, 6vw, 48px);
            font-weight: 900;
            color: white;
            line-height: 1;
        }

        .time-box label {
            font-size: 10px;
            color: var(--uni-blue);
            text-transform: uppercase;
            font-weight: 700;
            letter-spacing: 1px;
        }

        /* --- PREVIEW BOX --- */
        .preview-box {
            position: relative;
            width: 100%;
            max-width: 600px;
            height: clamp(200px, 40vh, 350px);
            margin: 0 auto 40px;
        }

        .preview-img {
            position: absolute;
            width: 80%;
            border-radius: clamp(10px, 3vw, 20px);
            border: 1px solid var(--glass-border);
            left: 50%;
            transform: translateX(-50%);
            transition: 0.8s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        .img-1 { top: 0; z-index: 1; opacity: 0.2; filter: blur(10px); transform: translateX(-60%) scale(0.9); }
        .img-2 { top: 30px; z-index: 2; opacity: 0.6; filter: blur(4px); }
        
        /* Interactive hover for desktop */
        @media (min-width: 1024px) {
            .preview-box:hover .img-1 { transform: translateX(-80%) rotate(-5deg); opacity: 0.4; filter: blur(2px); }
            .preview-box:hover .img-2 { transform: translateX(-20%) rotate(5deg); opacity: 0.9; filter: blur(0); }
        }

        /* --- NOTIFY FORM --- */
        .notify-form {
            background: var(--glass);
            backdrop-filter: blur(20px);
            padding: 8px;
            border-radius: 20px;
            border: 1px solid var(--glass-border);
            display: flex;
            width: 100%;
            max-width: 500px;
            margin: 0 auto;
            box-sizing: border-box;
        }

        .notify-form input {
            background: transparent;
            border: none;
            color: white;
            padding: 12px 20px;
            flex: 1;
            outline: none;
            font-size: 16px;
            min-width: 0; /* Prevents overflow in flexbox */
        }

        .btn-launch {
            background: var(--uni-blue);
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
            white-space: nowrap;
        }

        /* --- MOBILE ADJUSTMENTS --- */
        @media (max-width: 600px) {
            .coming-soon-wrapper { padding: 60px 20px; }
            
            .notify-form {
                flex-direction: column;
                background: transparent;
                border: none;
                padding: 0;
                gap: 12px;
            }

            .notify-form input {
                background: var(--glass);
                border: 1px solid var(--glass-border);
                border-radius: 15px;
                padding: 18px;
                width: 100%;
            }

            .btn-launch {
                width: 100%;
                padding: 18px;
            }

            .preview-box {
                height: 220px; /* Force height so it doesn't collapse */
            }
            
            .img-1 { transform: translateX(-55%) scale(0.85); }
            .img-2 { transform: translateX(-45%) scale(0.95); opacity: 0.8; filter: blur(2px); }
        }
    </style>
</head>
<body>

    <main class="coming-soon-wrapper">
        <div class="glow-bg"></div>

        <div class="status-badge">Launching April 1st</div>
        
        <h1 class="main-title">
            <span class="gradient-text">The Future of</span><br>
            <span style="color: var(--uni-blue);">Academic Matching.</span>
        </h1>

        <p class="sub-text">
            We're upgrading UniMatcher with the 2026 university requirements. 
            Get ready for the most accurate placement tool in Ghana.
        </p>

        <div class="countdown-grid">
            <div class="time-box">
                <span id="days">00</span>
                <label>Days</label>
            </div>
            <div class="time-box">
                <span id="hours">00</span>
                <label>Hours</label>
            </div>
            <div class="time-box">
                <span id="minutes">00</span>
                <label>Mins</label>
            </div>
            <div class="time-box">
                <span id="seconds">00</span>
                <label>Secs</label>
            </div>
        </div>

        <div class="preview-box">
            <img src="images/dash.png" class="preview-img img-1" alt="Dashboard">
            <img src="images/UI UniMatcher.png" class="preview-img img-2" alt="Interface">
        </div>

        <div class="notify-form">
            <input type="email" placeholder="Your email address...">
            <button class="btn-launch">Get Early Access</button>
        </div>
    </main>

    <script src="global.js"></script>
    
    <script>
        const targetDate = new Date("April 1, 2026 00:00:00").getTime();

        const timer = setInterval(function() {
            const now = new Date().getTime();
            const distance = targetDate - now;

            const d = Math.floor(distance / (1000 * 60 * 60 * 24));
            const h = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const m = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            const s = Math.floor((distance % (1000 * 60)) / 1000);

            document.getElementById("days").innerText = d.toString().padStart(2, '0');
            document.getElementById("hours").innerText = h.toString().padStart(2, '0');
            document.getElementById("minutes").innerText = m.toString().padStart(2, '0');
            document.getElementById("seconds").innerText = s.toString().padStart(2, '0');

            if (distance < 0) {
                clearInterval(timer);
                document.querySelector(".countdown-grid").innerHTML = "<h3>WE ARE LIVE!</h3>";
            }
        }, 1000);
    </script>
</body>
</html>
