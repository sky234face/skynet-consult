<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>Eligibility Engine | UniMatcher</title>
    <link rel="icon" type="image/png" href="/src/assets/unimatcher-logo.png">
    <meta name="theme-color" content="#003B73">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <script>
        tailwind.config = {
            theme: { 
                extend: { 
                    colors: { brandBlue: '#003B73', brandOrange: '#F28C00' }, 
                    fontFamily: { sans: ['Plus Jakarta Sans', 'sans-serif'] } 
                } 
            }
        }
    </script>
    <style>
        .custom-scroll::-webkit-scrollbar { width: 5px; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        .search-dropdown { transition: all 0.2s ease-out; transform-origin: top; }
        .glass-card { background: rgba(255, 255, 255, 0.98); backdrop-filter: blur(10px); }
        
        /* Ensures inputs don't zoom in on iPhone when clicked */
        input, select { font-size: 16px !important; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen font-sans text-slate-900">
    <main class="dashboard-container max-w-6xl mx-auto px-4 md:px-6 py-6 md:py-12">
        <div class="glass-card rounded-[2rem] md:rounded-[3rem] shadow-2xl border border-white overflow-hidden">
            
            <div class="bg-brandBlue p-6 md:p-10 text-white relative">
                <div class="relative z-10 flex flex-col md:flex-row md:items-center justify-between gap-6">
                    <div>
                        <span class="bg-orange-500 text-[10px] font-bold px-3 py-1 rounded-full uppercase tracking-widest">WASSCE Standards</span>
                        <h1 class="text-3xl md:text-4xl font-black mt-3">Eligibility Engine</h1>
                        <p class="text-blue-100 opacity-80 mt-1 text-sm md:text-base">Best 6 Aggregate Calculation (3 Cores + 3 Electives)</p>
                    </div>
                    <div class="bg-white/10 p-4 rounded-2xl backdrop-blur-md self-start md:self-auto">
                        <p class="text-[10px] font-bold uppercase opacity-60">Status</p>
                        <p class="font-black text-brandOrange flex items-center gap-2">
                            <span class="w-2 h-2 bg-brandOrange rounded-full animate-pulse"></span> SYSTEM ACTIVE
                        </p>
                    </div>
                </div>
            </div>

            <form id="eligibility-form" class="p-6 md:p-12 space-y-10 md:y-12">
                
                <div class="space-y-4 max-w-2xl">
                    <label class="block text-[10px] font-black text-slate-400 uppercase tracking-[0.2em] ml-2">Intended University Program</label>
                    <div class="relative group">
                        <i class="fas fa-university absolute left-5 top-1/2 -translate-y-1/2 text-slate-300 group-focus-within:text-brandBlue"></i>
                        <input type="text" id="prog-search" placeholder="Search for a program..." 
                               class="w-full pl-12 pr-4 py-4 md:py-5 bg-slate-50 border-2 border-slate-100 rounded-2xl outline-none focus:border-brandBlue focus:bg-white transition-all font-bold text-slate-700 shadow-sm" required>
                        <input type="hidden" id="program-id" required>
                        <div id="prog-results" class="absolute z-30 w-full mt-2 bg-white border border-slate-100 shadow-2xl rounded-2xl max-h-60 overflow-y-auto custom-scroll hidden search-dropdown"></div>
                    </div>
                </div>

                <div class="grid grid-cols-1 lg:grid-cols-2 gap-10 md:gap-12">
                    
                    <div class="space-y-6">
                        <div class="flex items-center gap-3 border-b border-slate-100 pb-4">
                            <div class="w-10 h-10 bg-brandOrange/10 rounded-xl flex items-center justify-center text-brandOrange">
                                <i class="fas fa-book-open"></i>
                            </div>
                            <h3 class="font-black text-lg text-slate-800 uppercase tracking-tight">Core Subjects (4)</h3>
                        </div>
                        <div id="core-inputs" class="grid gap-4">
                            </div>
                    </div>

                    <div class="space-y-6">
                        <div class="flex items-center gap-3 border-b border-slate-100 pb-4">
                            <div class="w-10 h-10 bg-brandBlue/10 rounded-xl flex items-center justify-center text-brandBlue">
                                <i class="fas fa-flask"></i>
                            </div>
                            <h3 class="font-black text-lg text-slate-800 uppercase tracking-tight">Electives (4)</h3>
                        </div>
                        <div id="elective-inputs" class="grid gap-4">
                            </div>
                    </div>
                </div>

                <div class="pt-8 border-t border-slate-50 flex flex-col items-center">
                    <button type="submit" class="w-full max-w-md py-5 md:py-6 bg-brandBlue text-white font-black text-lg rounded-2xl md:rounded-3xl shadow-2xl shadow-blue-900/30 hover:scale-[1.02] active:scale-95 transition-all flex items-center justify-center gap-4">
                        <span>CHECK MATCH & PAY</span>
                        <i class="fas fa-chevron-right text-xs"></i>
                    </button>
                    <p class="mt-6 text-slate-400 text-[10px] font-bold uppercase tracking-widest text-center">
                        <i class="fas fa-shield-alt mr-2"></i> Results are verified against official WASSCE mapping
                    </p>
                </div>
            </form>
        </div>
    </main>

    <script src="js/global.js"></script>
    <script src="js/eligibility.js"></script>
</body>
</html>
