<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Campaign Command | UniMatcher</title>
    <link rel="icon" type="image/png" href="/src/assets/unimatcher-logo.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@200;400;700;800&display=swap');
        
        :root { --accent: #fbbf24; --bg: #020617; }
        body { 
            background: var(--bg);
            background-image: 
                radial-gradient(at 0% 0%, rgba(30, 58, 138, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(139, 92, 246, 0.1) 0px, transparent 50%);
            font-family: 'Plus Jakarta Sans', sans-serif;
            color: #f8fafc;
        }

        .premium-card {
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }

        .gold-text {
            background: linear-gradient(to right, #fde68a, #fbbf24, #d97706);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .stats-ring {
            transition: stroke-dashoffset 1s ease-in-out;
            transform: rotate(-90deg);
            transform-origin: 50% 50%;
        }

        .agent-row:hover {
            background: linear-gradient(90deg, rgba(255,255,255,0.03) 0%, transparent 100%);
            transform: translateX(10px);
        }

        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }
        .floating { animation: float 4s ease-in-out infinite; }

        .tier-badge {
            font-size: 8px;
            padding: 2px 8px;
            border-radius: 99px;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 800;
        }
    </style>
</head>
<body class="p-4 md:p-12 overflow-x-hidden">
    <div class="max-w-7xl mx-auto mb-6 animate__animated animate__fadeIn">
    <a href="index.html" class="inline-flex items-center gap-3 px-5 py-2.5 rounded-2xl glass hover:bg-white/10 transition-all group border border-white/5">
        <div class="bg-white/5 p-2 rounded-lg group-hover:-translate-x-1 transition-transform">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="text-yellow-500" viewBox="0 0 16 16">
                <path fill-rule="evenodd" d="M15 8a.5.5 0 0 0-.5-.5H2.707l3.147-3.146a.5.5 0 1 0-.708-.708l-4 4a.5.5 0 0 0 0 .708l4 4a.5.5 0 0 0 .708-.708L2.707 8.5H14.5A.5.5 0 0 0 15 8z"/>
            </svg>
        </div>
        <div>
            <span class="block text-[10px] font-bold uppercase tracking-widest text-slate-500 leading-none mb-1">Navigation</span>
            <span class="block text-xs font-black text-white uppercase tracking-tighter">Return to Base</span>
        </div>
    </a>
</div>

    <header class="max-w-7xl mx-auto flex flex-col md:flex-row justify-between items-start md:items-end mb-16 gap-8">
        <div class="animate__animated animate__fadeInLeft">
            <div class="flex items-center gap-3 mb-2">
                <span class="h-[2px] w-12 bg-yellow-500"></span>
                <span class="text-yellow-500 font-bold tracking-[0.4em] text-[10px] uppercase">Official Campaign Rankings</span>
            </div>
            <h1 class="text-5xl md:text-7xl font-extrabold tracking-tighter italic uppercase">THE <span class="gold-text">VANGUARD</span></h1>
            <p class="text-slate-500 mt-2 font-medium">Tracking top-performing campaign agents in real-time.</p>
        </div>
        
        <div class="flex flex-col gap-4 animate__animated animate__fadeInRight w-full md:w-auto">
            <div class="flex gap-3 justify-end">
                <a href="terminal.html" class="px-5 py-2 rounded-xl border border-white/10 hover:bg-white/5 transition-all text-[10px] font-black uppercase tracking-widest text-slate-400">
                    Command Login
                </a>
                <a href="enlist.html" class="px-5 py-2 rounded-xl bg-yellow-500 hover:bg-yellow-400 transition-all text-[10px] font-black uppercase tracking-widest text-black shadow-lg shadow-yellow-500/10">
                    Join the Force
                </a>
            </div>

            <div class="flex gap-8 bg-white/5 p-6 rounded-3xl border border-white/5">
                <div class="text-center">
                    <div class="text-3xl font-bold" id="total-referrals">--</div>
                    <div class="text-[9px] uppercase tracking-widest text-slate-500 font-bold">Network Reach</div>
                </div>
                <div class="w-[1px] bg-white/10 h-10"></div>
                <div class="text-center">
                    <div class="text-3xl font-bold gold-text" id="active-agents">--</div>
                    <div class="text-[9px] uppercase tracking-widest text-slate-500 font-bold">Active Agents</div>
                </div>
            </div>
        </div>
    </header>

    <div id="podium-area" class="max-w-7xl mx-auto grid grid-cols-1 md:grid-cols-3 gap-10 mb-24 items-end">
        </div>

    <div class="max-w-6xl mx-auto">
        <div class="flex justify-between items-center mb-8 px-6">
            <h2 class="text-xl font-bold tracking-tight">Field Force <span class="text-slate-600 font-light ml-2">/ Top 20</span></h2>
            <div class="flex gap-4 text-[10px] font-bold uppercase tracking-widest text-slate-500">
                <span>Rank</span>
                <span>Agent Performance</span>
            </div>
        </div>

        <div id="agent-list" class="space-y-3">
            </div>
    </div>
    <div id="live-pulse" class="fixed bottom-8 left-8 z-50 pointer-events-none">
    <div id="pulse-card" class="premium-card rounded-2xl p-4 flex items-center gap-4 border-yellow-500/30 transform translate-y-32 opacity-0 transition-all duration-700">
        <div class="relative">
            <div class="w-10 h-10 bg-yellow-500/10 rounded-full flex items-center justify-center">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="text-yellow-500" viewBox="0 0 16 16">
                    <path d="M8 15A7 7 0 1 1 8 1a7 7 0 0 1 0 14zm0 1A8 8 0 1 0 8 0a8 8 0 0 0 0 16z"/>
                    <path d="M10.97 4.97a.235.235 0 0 0-.02.022L7.477 9.417 5.384 7.323a.75.75 0 0 0-1.06 1.06L6.97 11.03a.75.75 0 0 0 1.079-.02l3.992-4.99a.75.75 0 0 0-1.071-1.05z"/>
                </svg>
            </div>
            <span class="absolute -top-1 -right-1 flex h-3 w-3">
                <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-yellow-400 opacity-75"></span>
                <span class="relative inline-flex rounded-full h-3 w-3 bg-yellow-500"></span>
            </span>
        </div>
        <div>
            <p class="text-[10px] font-bold text-yellow-500 uppercase tracking-widest leading-none mb-1">New Intel Received</p>
            <p id="pulse-text" class="text-xs font-medium text-white tracking-tight">Agent <span class="font-bold text-yellow-200">Alpha-01</span> just secured a referral.</p>
        </div>
    </div>
</div>

    <script>
        const API_BASE = "https://api.unimatcher-skynetconsult.com/api";

        async function initDashboard() {
    try {
        const res = await fetch(`${API_BASE}/public/leaderboard`);
        const data = await res.json();
        
        // Calculate the data
        const totalSignups = data.leaderboard.reduce((a, b) => a + (b.signups || 0), 0);
        const totalAgents = data.leaderboard.length;

        // Update the Main Stat Cards
        document.getElementById('total-referrals').innerText = totalSignups;
        document.getElementById('active-agents').innerText = totalAgents;

        // Render the Podium and the List
        renderElite(data.leaderboard.slice(0, 3));
        renderField(data.leaderboard.slice(3));

        // START THE LIVE FEED (Using the data we just fetched)
        startLiveSim(data.leaderboard);

    } catch (err) {
        console.error("Dashboard Sync Failed", err);
    }
}

        function getTier(signups) {
            if (signups >= 50) return { name: 'Vanguard', color: 'bg-yellow-500/20 text-yellow-500 border-yellow-500/50' };
            if (signups >= 20) return { name: 'Veteran', color: 'bg-purple-500/20 text-purple-500 border-purple-500/50' };
            return { name: 'Rising Star', color: 'bg-blue-500/20 text-blue-500 border-blue-500/50' };
        }

        function renderElite(top3) {
            const container = document.getElementById('podium-area');
            const layout = [top3[1], top3[0], top3[2]]; // 2nd, 1st, 3rd

            container.innerHTML = layout.map((a, i) => {
                if(!a) return '<div></div>';
                const isGold = a.rank === 1;
                const tier = getTier(a.signups);
                
                return `
                    <div class="premium-card rounded-[3rem] p-10 relative transition-all duration-500 hover:scale-[1.02] ${isGold ? 'border-yellow-500/30 ring-1 ring-yellow-500/20 floating z-20' : 'scale-90 opacity-60'}">
                        ${isGold ? '<div class="absolute -top-6 left-1/2 -translate-x-1/2 bg-yellow-500 text-black px-6 py-1 rounded-full text-[10px] font-black uppercase tracking-tighter shadow-xl shadow-yellow-500/20">Leader</div>' : ''}
                        
                        <div class="text-center">
                            <span class="tier-badge ${tier.color} border mb-4 inline-block">${tier.name}</span>
                            <h3 class="text-3xl font-black tracking-tighter mb-1">${a.name.split(' ')[0]}</h3>
                            <p class="font-mono text-slate-500 text-xs tracking-widest mb-8">${a.code}</p>
                            
                            <div class="relative w-32 h-32 mx-auto mb-8">
                                <svg class="w-full h-full">
                                    <circle cx="64" cy="64" r="60" stroke="rgba(255,255,255,0.05)" stroke-width="8" fill="transparent" />
                                    <circle cx="64" cy="64" r="60" stroke="${isGold ? '#fbbf24' : '#6366f1'}" stroke-width="8" fill="transparent" 
                                        stroke-dasharray="377" stroke-dashoffset="${377 - (377 * (a.signups / 100))}" class="stats-ring" />
                                </svg>
                                <div class="absolute inset-0 flex flex-col items-center justify-center">
                                    <span class="text-3xl font-black">${a.signups}</span>
                                    <span class="text-[8px] uppercase text-slate-500 font-bold">Referrals</span>
                                </div>
                            </div>

                            <div class="grid grid-cols-2 gap-4 border-t border-white/5 pt-6">
                                <div>
                                    <div class="text-xs text-slate-500 uppercase font-bold mb-1">Checks</div>
                                    <div class="font-bold">${a.total_checks}</div>
                                </div>
                                <div>
                                    <div class="text-xs text-slate-500 uppercase font-bold mb-1">Impact</div>
                                    <div class="font-bold text-yellow-500">High</div>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function renderField(others) {
            const container = document.getElementById('agent-list');
            container.innerHTML = others.map(a => {
                const tier = getTier(a.signups);
                return `
                    <div class="agent-row premium-card rounded-2xl p-6 flex items-center justify-between transition-all group cursor-default">
                        <div class="flex items-center gap-6">
                            <div class="text-2xl font-black text-white/10 group-hover:text-yellow-500/20 transition">#${String(a.rank).padStart(2, '0')}</div>
                            <div>
                                <div class="flex items-center gap-3">
                                    <span class="font-bold text-lg">${a.name.split(' ')[0]}</span>
                                    <span class="tier-badge ${tier.color} border">${tier.name}</span>
                                </div>
                                <div class="text-[10px] font-mono text-slate-500 uppercase tracking-tighter">${a.code}</div>
                            </div>
                        </div>
                        
                        <div class="flex gap-12 items-center">
                            <div class="text-right">
                                <div class="text-xs font-bold text-slate-500 uppercase mb-1">Campaign Score</div>
                                <div class="flex items-center gap-3">
                                    <div class="w-32 h-1.5 bg-white/5 rounded-full overflow-hidden hidden md:block">
                                        <div class="h-full bg-yellow-500/50" style="width: ${Math.min(a.signups * 2, 100)}%"></div>
                                    </div>
                                    <span class="font-black text-xl">${a.signups}</span>
                                </div>
                            </div>
                            <div class="hidden md:block">
                                <div class="text-[10px] font-bold text-slate-600 uppercase">Recent Pulse</div>
                                <div class="w-2 h-2 bg-green-500 rounded-full animate-pulse mx-auto mt-2"></div>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function triggerPulse(agentName) {
    const card = document.getElementById('pulse-card');
    const text = document.getElementById('pulse-text');
    
    // Update content
    text.innerHTML = `Agent <span class="font-bold text-yellow-200">${agentName.split(' ')[0]}</span> just secured a referral.`;
    
    // Slide In
    card.classList.remove('translate-y-32', 'opacity-0');
    
    // Slide Out after 4 seconds
    setTimeout(() => {
        card.classList.add('translate-y-32', 'opacity-0');
    }, 4000);
}

// Randomly trigger the pulse every 15-30 seconds to simulate real activity
function startLiveSim(agents) {
    if (agents.length === 0) return;
    
    setInterval(() => {
        const randomAgent = agents[Math.floor(Math.random() * agents.length)];
        triggerPulse(randomAgent.name);
    }, Math.floor(Math.random() * (30000 - 15000) + 15000));
}
        document.addEventListener('DOMContentLoaded', initDashboard);
    </script>
</body>
</html>
